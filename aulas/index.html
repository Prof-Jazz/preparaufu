.capaed{display:flex;gap:14px;align-items:flex-start}.capaed .pv{width:96px;aspect-ratio:9/16;border-radius:10px;border:1px dashed var(--line);background:var(--bg) center/cover no-repeat;flex:none;display:grid;place-items:center;color:var(--muted);font-size:12px;text-align:center;padding:4px}

.dlg{position:fixed;inset:0;z-index:60;background:rgba(5,8,18,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}

const faixa=a=>a.ini?(hm(a.ini)+(a.fim?' às '+hm(a.fim):'')):'';
const HOJE=iso(new Date());
const tamanho=b=>!b?'':b<1024*1024?Math.max(1,Math.round(b/1024))+' KB':(b/1048576).toFixed(1).replace('.',',')+' MB';
const ext=n=>(String(n).split('.').pop()||'').toLowerCase();
const fic=n=>{const e=ext(n);const c=e==='pdf'?'pdf':['png','jpg','jpeg','gif','webp','svg','heic'].includes(e)?'img':['doc','docx','odt','txt'].includes(e)?'doc':['xls','xlsx','csv','ods'].includes(e)?'xls':['ppt','pptx','key','odp'].includes(e)?'ppt':['mp4','mov','avi','mkv','mp3','m4a'].includes(e)?'vid':'';return `<div class="fi ${c}">${esc((e||'arq').slice(0,4).toUpperCase())}</div>`;};
const tags=t=>(t||[]).map(k=>{const x=TURMAS.find(z=>z[0]===k);return x?`<span class="tg ${x[2]}">${x[1]}</span>`:'';}).join('');
const titulo=a=>a.titulo||(a.tipo==='aula'?(IS_ADMIN?'Aula prevista — clique para cadastrar':'Aula ao vivo · tema em breve'):(TIPOS.find(t=>t[0]===a.tipo)||['','Evento'])[1]);
const linkOk=u=>/^https:\/\//i.test(u||'');
const capaURL=p=>p?SB.storage.from('capas').getPublicUrl(p).data.publicUrl:'';
async function prepCapa(file){const img=await createImageBitmap(file);const W=1080,H=1920,c=document.createElement('canvas');c.width=W;c.height=H;
  const k=Math.max(W/img.width,H/img.height),w=img.width*k,h=img.height*k;c.getContext('2d').drawImage(img,(W-w)/2,(H-h)/2,w,h);
  return await new Promise(r=>c.toBlob(r,'image/jpeg',0.86));}

/* login */
let novo=false;const gm=(t,ok)=>{$('gMsg').textContent=t;$('gMsg').className=ok?'ok':'';};
function modo(n){novo=n;$('gPass2').hidden=!n;$('gPass2').required=n;$('gBtn').textContent=n?'Criar senha e entrar':'Entrar';
  $('gMode').textContent=n?'Já tenho senha — entrar':'Primeiro acesso? Crie sua senha';
  $('gTxt').textContent=n?'Use o e-mail que o Prof. Jazz liberou e escolha uma senha.':'Entre com o mesmo e-mail e senha do Banco de Questões.';gm('');}
$('gMode').onclick=()=>modo(!novo);
$('gForm').onsubmit=async ev=>{ev.preventDefault();const email=$('gEmail').value.trim().toLowerCase(),password=$('gPass').value;$('gBtn').disabled=true;gm('Aguarde…',true);
  try{
    if(novo){if(password!==$('gPass2').value)throw new Error('As senhas não conferem.');
      const {data:ok}=await SB.rpc('email_permitido',{e:email});if(!ok)throw new Error('Este e-mail ainda não foi liberado pelo Prof. Jazz.');
      const {data,error}=await SB.auth.signUp({email,password});
      if(error){if(/registered|exists/i.test(error.message))throw new Error('Esse e-mail já tem senha. Clique em “Já tenho senha — entrar”.');throw error;}
      if(!data.session){const r=await SB.auth.signInWithPassword({email,password});if(r.error)throw r.error;}
    }else{const {error}=await SB.auth.signInWithPassword({email,password});
      if(error){if(/invalid/i.test(error.message))throw new Error('E-mail ou senha incorretos. É a mesma senha do Banco de Questões.');throw error;}}
    gm('');await entrar();
  }catch(e){gm(e.message||'Não foi possível entrar.');}finally{$('gBtn').disabled=false;}};
async function entrar(){const {data:{session}}=await SB.auth.getSession();if(!session){location.replace('/?volta='+encodeURIComponent(location.pathname+location.hash));return;}
  EMAIL=(session.user.email||'').toLowerCase();REAL_ADMIN=EMAIL===ADMIN;IS_ADMIN=REAL_ADMIN;
  const {data:ok}=await SB.rpc('is_allowed');
  if(!ok){await SB.auth.signOut();$('gate').hidden=false;gm('Seu acesso não está liberado. Fale com o Prof. Jazz.');return;}
  $('gate').hidden=true;
  $('tabAg').onclick=()=>{history.replaceState(null,'','#agenda');telaAgenda();};
  $('tabMat').onclick=()=>{history.replaceState(null,'','#materiais');telaMat();};
  if(REAL_ADMIN){$('tabEx').hidden=false;try{EXT=sessionStorage.getItem('bqufu-exemplo');}catch(e){}
    $('tabEx').onclick=()=>exemplo('assessoria');$('exSair').onclick=()=>exemplo(null);$('exTurma').onchange=()=>exemplo($('exTurma').value);aplicaEx();}
  if(location.hash==='#materiais')telaMat();else telaAgenda();}
function aplicaEx(){IS_ADMIN=REAL_ADMIN&&!EXT;$('exBar').hidden=!EXT;$('tabEx').hidden=!REAL_ADMIN||!!EXT;if(EXT)$('exTurma').value=EXT;}
function exemplo(t){EXT=t;try{t?sessionStorage.setItem('bqufu-exemplo',t):sessionStorage.removeItem('bqufu-exemplo');}catch(e){}aplicaEx();
  if($('tabMat').classList.contains('on'))telaMat();else telaAgenda();}
$('sair').onclick=async()=>{await SB.auth.signOut();location.href='/';};
const abas=on=>['tabAg','tabMat'].forEach(t=>$(t).classList.toggle('on',t===on));

async function carregar(){
  const [a,b,c]=await Promise.all([SB.from('aulas').select('*').order('data').order('ini',{nullsFirst:true}),SB.from('arquivos').select('*').order('criado_em'),SB.from('pastas').select('*').order('ordem').order('criado_em')]);
  const err=a.error||b.error||c.error;if(err)throw err;AULAS=a.data||[];ARQ=b.data||[];PASTAS=c.data||[];
  if(EXT){AULAS=AULAS.filter(x=>(x.turmas||[]).includes(EXT));PASTAS=PASTAS.filter(x=>(x.turmas||[]).includes(EXT));ARQ=ARQ.filter(f=>f.pasta?PASTAS.some(x=>x.id===f.pasta):AULAS.some(x=>x.id===f.aula));}}
async function abrirArq(f,btn){const w=window.open('','_blank');if(btn)btn.disabled=true;
  const {data,error}=await SB.storage.from('materiais').createSignedUrl(f.path,3600);if(btn)btn.disabled=false;
  if(error||!data){if(w)w.close();alert('Não foi possível abrir o arquivo: '+(error?error.message:''));return;}
  if(w)w.location=data.signedUrl;else location.href=data.signedUrl;}
const nomeSeguro=n=>n.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_').slice(-80);
async function enviar(files,dono,id,prog){for(const [i,f] of [...files].entries()){
    if(f.size>200*1048576){alert(f.name+' tem mais de 200 MB e não foi enviado.');continue;}
    if(prog)prog(`Enviando ${i+1} de ${files.length}: ${f.name}…`);
    const path=`${dono}/${id}/${Date.now()}-${nomeSeguro(f.name)}`;
    const up=await SB.storage.from('materiais').upload(path,f,{contentType:f.type||undefined,upsert:false});
    if(up.error){alert('Erro ao enviar '+f.name+': '+up.error.message);continue;}
    const row={nome:f.name,path,tipo:f.type||null,tamanho:f.size};row[dono]=id;
    const ins=await SB.from('arquivos').insert(row);if(ins.error){alert('Erro ao registrar '+f.name+': '+ins.error.message);await SB.storage.from('materiais').remove([path]);}}
  if(prog)prog('');}
async function apagarArq(f){await SB.storage.from('materiais').remove([f.path]);const {error}=await SB.from('arquivos').delete().eq('id',f.id);if(error)alert(error.message);}
function linhaArq(f,adm){return `<div class="arq">${fic(f.nome)}<div class="tx"><b>${esc(f.nome)}</b><span>${tamanho(f.tamanho)}${f.criado_em?' · enviado em '+new Date(f.criado_em).toLocaleDateString('pt-BR'):''}</span></div><div class="bt"><button class="btn" data-abre="${f.id}">Abrir</button>${adm?`<button class="btn del" data-apaga="${f.id}">Excluir</button>`:''}</div></div>`;}
function ligaArqs(root,depois){root.querySelectorAll('[data-abre]').forEach(b=>b.onclick=()=>abrirArq(ARQ.find(f=>f.id===b.dataset.abre),b));
  root.querySelectorAll('[data-apaga]').forEach(b=>b.onclick=async()=>{const f=ARQ.find(x=>x.id===b.dataset.apaga);if(!confirm('Excluir o arquivo “'+f.nome+'”?'))return;b.disabled=true;await apagarArq(f);await carregar();depois();});}
function zonaUpload(el,dono,id,depois){el.innerHTML=`<div class="drop" tabindex="0"><b>+ Enviar arquivos</b><br><span style="font-size:13px">Clique ou arraste aqui PDFs, imagens, planilhas… (até 200 MB cada)</span><input type="file" multiple hidden></div><p class="pend up" style="margin:6px 0 0"></p>`;
  const d=el.querySelector('.drop'),inp=el.querySelector('input'),pr=t=>el.querySelector('.up').textContent=t;
  const go=async fs=>{if(!fs.length)return;await enviar(fs,dono,id,pr);await carregar();depois();};
  d.onclick=()=>inp.click();d.onkeydown=e=>{if(e.key==='Enter')inp.click();};inp.onchange=()=>go(inp.files);
  d.ondragover=e=>{e.preventDefault();d.classList.add('on');};d.ondragleave=()=>d.classList.remove('on');d.ondrop=e=>{e.preventDefault();d.classList.remove('on');go(e.dataTransfer.files);};}

/* ---------- agenda ---------- */
async function telaAgenda(){abas('tabAg');$('app').innerHTML='<p class="pend">Carregando a agenda…</p>';
  try{await carregar();}catch(e){$('app').innerHTML=`<div class="card"><p class="pend">${esc(e.message)}</p></div>`;return;}
  if(!MES){const prox=AULAS.find(a=>a.data>=HOJE);const d=prox?parse(prox.data):new Date();MES=new Date(d.getFullYear(),d.getMonth(),1);}
  desenhaAgenda();}
function desenhaAgenda(){
  const prox=AULAS.filter(a=>['aula','revisao'].includes(a.tipo)&&(a.data>HOJE||(a.data===HOJE&&(!a.fim||a.fim.slice(0,5)>=new Date().toTimeString().slice(0,5)))))[0];
  const y=MES.getFullYear(),m=MES.getMonth();const ini=new Date(y,m,1-new Date(y,m,1).getDay());
  const dias=[];for(let i=0;i<42;i++){const d=new Date(ini.getFullYear(),ini.getMonth(),ini.getDate()+i);if(i>=35&&d.getMonth()!==m)break;dias.push(d);}
  const doMes=AULAS.filter(a=>{const d=parse(a.data);return d.getFullYear()===y&&d.getMonth()===m;});
  const cls=a=>a.tipo==='aula'?(a.titulo?'':'prev'):a.tipo;
  const ev=a=>{const nf=ARQ.filter(f=>f.aula===a.id).length;return `<button class="ev ${cls(a)}" data-id="${a.id}" title="${esc(titulo(a))}">${esc(a.tipo==='aula'&&!a.titulo?(IS_ADMIN?'Aula prevista':'Aula ao vivo'):titulo(a))}<small>${esc(faixa(a))}${a.professor?' · '+esc(a.professor):''}</small>${nf?`<span class="clip">📎 ${nf} material${nf>1?'is':''}</span>`:''}</button>`;};
  $('app').innerHTML=`${prox?`<div class="prox"><div class="dt"><b>${parse(prox.data).getDate()}</b><span>${MESES[parse(prox.data).getMonth()].slice(0,3)}</span></div>
     <div class="inf"><div class="k">${prox.data===HOJE?'Hoje':'Próxima aula'} · ${DSEM[parse(prox.data).getDay()]}, ${esc(faixa(prox))}</div><h3>${esc(prox.titulo||'Aula ao vivo · tema em breve')}</h3><p>${prox.professor?'com '+esc(prox.professor):'PREPARA UFU'}</p></div>
     <div class="act">${linkOk(prox.link)?`<a class="btn live" href="${esc(prox.link)}" target="_blank" rel="noopener">Clique aqui para a aula ao vivo</a>`:'<span class="pend" style="color:#D6E6F5">O link da aula aparece aqui antes de começar.</span>'}<button class="btn" data-id="${prox.id}">Ver detalhes e materiais</button></div></div>`:''}
   <div class="card"><div class="calh"><h2>${MESES[m]} <small>${y}</small></h2><div class="nav"><button class="hoje" id="mHoje">Hoje</button><button id="mAnt" aria-label="Mês anterior">‹</button><button id="mProx" aria-label="Próximo mês">›</button></div></div>
   ${IS_ADMIN?'<p class="pend" style="margin:-4px 0 12px">Clique numa aula para cadastrar o tema, o professor, o link do Meet, os materiais e as turmas. Clique num dia vazio para criar outro evento.</p>':''}
   <div class="cal">${['dom','seg','ter','qua','qui','sex','sáb'].map(d=>`<div class="dw">${d}</div>`).join('')}
   ${dias.map(d=>{const k=iso(d);const L=AULAS.filter(a=>a.data===k);const fer=FERIADOS[k],rec=k>=RECESSO[0]&&k<=RECESSO[1];
     return `<div class="d${d.getMonth()!==m?' fora':''}${k===HOJE?' hoje':''}${fer?' fer':''}${rec?' rec':''}${IS_ADMIN?' adm':''}" data-dia="${k}"><div class="n"><span>${d.getDate()}</span>${fer?`<i>${fer}</i>`:rec&&d.getDay()===1?'<i>recesso</i>':''}</div>${L.map(ev).join('')}</div>`;}).join('')}</div>
   <div class="leg"><span><i style="background:var(--azul)"></i>Aula ao vivo</span><span><i style="border:1.5px dashed var(--azul)"></i>Aula com tema a definir</span><span><i style="border:2px solid var(--roxo)"></i>Revisão final</span><span><i style="background:var(--amarelo)"></i>Simulado PREPARA UFU</span><span><i style="background:#111;border:2px solid var(--amarelo)"></i>Prova UFU</span><span><i style="background:var(--verm)"></i>Feriado</span><span><i style="background:rgba(217,67,79,.25)"></i>Recesso das aulas</span></div></div>
   <div class="card"><h2 class="t" style="font-size:19px;margin-bottom:10px">Eventos de ${MESES[m]}</h2><div class="lista">${doMes.length?doMes.map(a=>{const d=parse(a.data);const nf=ARQ.filter(f=>f.aula===a.id).length;const cor=a.tipo==='simulado'?'var(--amarelo)':a.tipo==='revisao'?'var(--roxo)':a.tipo==='prova'?'#111':a.tipo==='outro'?'var(--verde)':'var(--azul)';
      return `<div class="li${a.data<HOJE?' passou':''}" data-id="${a.id}" style="border-left-color:${cor}"><div class="dd"><b>${d.getDate()}</b><span>${DSEM[d.getDay()].slice(0,3)}</span></div><div class="tx"><b>${esc(titulo(a))}</b><span>${esc(faixa(a))}${a.professor?' · '+esc(a.professor):''}${nf?' · 📎 '+nf:''}${IS_ADMIN&&a.turmas.length<2?' · só '+esc((TURMAS.find(t=>t[0]===a.turmas[0])||['',''])[1]):''}</span></div>${linkOk(a.link)&&a.data>=HOJE?'<span class="tg ma">Meet</span>':''}</div>`;}).join(''):'<p class="pend" style="margin:0">Nenhum evento neste mês.</p>'}</div></div>`;
  $('mAnt').onclick=()=>{MES=new Date(y,m-1,1);desenhaAgenda();};$('mProx').onclick=()=>{MES=new Date(y,m+1,1);desenhaAgenda();};
  $('mHoje').onclick=()=>{const d=new Date();MES=new Date(d.getFullYear(),d.getMonth(),1);desenhaAgenda();};
  $('app').querySelectorAll('[data-id]').forEach(b=>b.onclick=ev=>{ev.stopPropagation();verEvento(AULAS.find(a=>a.id===b.dataset.id));});
  if(IS_ADMIN)$('app').querySelectorAll('.d.adm').forEach(c=>c.onclick=()=>editarEvento(null,c.dataset.dia));
  else $('app').querySelectorAll('.d').forEach(c=>c.onclick=()=>{const L=AULAS.filter(a=>a.data===c.dataset.dia);if(L.length)verEvento(L[0]);});}
function dialogo(html){const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="box">${html}</div>`;document.body.appendChild(d);
  const fecha=()=>{d.remove();document.removeEventListener('keydown',esc_);};const esc_=e=>{if(e.key==='Escape')fecha();};document.addEventListener('keydown',esc_);
  d.onclick=e=>{if(e.target===d)fecha();};d.querySelectorAll('[data-fecha]').forEach(b=>b.onclick=fecha);return [d,fecha];}
function verEvento(a){if(!a)return;if(IS_ADMIN){editarEvento(a);return;}
  const d=parse(a.data);const L=ARQ.filter(f=>f.aula===a.id);
  const [dl]=dialogo(`<div class="top"><div><h3>${esc(titulo(a))}</h3><p>${DSEM[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}${faixa(a)?' · '+esc(faixa(a)):''}</p></div><button class="x" data-fecha aria-label="Fechar">×</button></div>
   <div class="bd">${a.professor?`<p style="margin:0"><b>Professor:</b> ${esc(a.professor)}</p>`:''}${a.descricao?`<p style="margin:0;white-space:pre-wrap">${esc(a.descricao)}</p>`:''}
   ${['aula','revisao','outro'].includes(a.tipo)?(linkOk(a.link)?`<a class="btn live" href="${esc(a.link)}" target="_blank" rel="noopener" style="align-self:flex-start">Clique aqui para a aula ao vivo</a>`:'<p class="pend" style="margin:0">O link da aula ao vivo aparece aqui antes de a aula começar.</p>'):''}
   <div><h4 style="margin:0 0 8px;font:700 16px var(--display)">Materiais da aula</h4>${L.length?`<div class="arqs">${L.map(f=>linhaArq(f,false)).join('')}</div>`:'<p class="pend" style="margin:0">Nenhum material anexado ainda.</p>'}</div></div>`);
  ligaArqs(dl,()=>{});}
function editarEvento(a,dia){const novoEv=!a;a=a||{data:dia,ini:'19:00',fim:'20:30',tipo:'aula',turmas:['assessoria','matematica']};
  const d=parse(a.data);
  const [dl,fecha]=dialogo(`<div class="top"><div><h3>${novoEv?'Novo evento':'Cadastrar aula / evento'}</h3><p>${DSEM[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]} de ${d.getFullYear()}</p></div><button class="x" data-fecha aria-label="Fechar">×</button></div>
   <form class="bd"><label class="f">Tema da aula (título)<input name="titulo" type="text" value="${esc(a.titulo||'')}" placeholder="ex.: Funções do 1º grau — teoria e questões da UFU"></label>
    <label class="f">Professor<input name="professor" type="text" value="${esc(a.professor||'')}" placeholder="ex.: Prof. Jazz"></label>
    <div class="row"><label class="f">Data<input name="data" type="date" value="${a.data}" required></label><label class="f">Início<input name="ini" type="time" value="${(a.ini||'').slice(0,5)}"></label><label class="f">Término<input name="fim" type="time" value="${(a.fim||'').slice(0,5)}"></label></div>
    <label class="f">Tipo<select name="tipo">${TIPOS.map(([k,n])=>`<option value="${k}"${a.tipo===k?' selected':''}>${n}</option>`).join('')}</select></label>
    <label class="f">Link do Google Meet<input name="link" type="url" value="${esc(a.link||'')}" placeholder="https://meet.google.com/abc-defg-hij"><span class="pend" style="font-weight:400">Para o aluno aparece o botão “Clique aqui para a aula ao vivo”.</span></label>
    <label class="f">Observações (opcional)<textarea name="descricao" placeholder="ex.: trazer a lista 3 impressa">${esc(a.descricao||'')}</textarea></label>
    <div class="f"><b style="font-size:14px">Liberar para as turmas</b><div class="chk">${TURMAS.map(([k,n])=>`<label><input type="checkbox" name="t_${k}"${(a.turmas||[]).includes(k)?' checked':''}> ${n}</label>`).join('')}</div></div>
    <div class="f"><b style="font-size:14px">Materiais da aula</b>${novoEv?'<p class="pend" style="margin:0">Salve o evento primeiro; depois é só abrir de novo para anexar materiais.</p>':`<div class="arqs" id="evArqs"></div><div id="evUp"></div>`}</div>
    <p class="msg"></p>
    <div class="btns"><button class="btn pri" type="submit">Salvar</button><button class="btn" type="button" data-fecha>Cancelar</button>${novoEv?'':'<button class="btn del" type="button" data-x="del" style="margin-left:auto">Excluir evento</button>'}</div></form>`);
  const f=dl.querySelector('form'),msg=t=>dl.querySelector('.msg').textContent=t;
  const arqs=()=>{const el=dl.querySelector('#evArqs');if(!el)return;const L=ARQ.filter(x=>x.aula===a.id);el.innerHTML=L.length?L.map(x=>linhaArq(x,true)).join(''):'<p class="pend" style="margin:0">Nenhum material ainda.</p>';ligaArqs(el,()=>{arqs();desenhaAgenda();});};
  if(!novoEv){arqs();zonaUpload(dl.querySelector('#evUp'),'aula',a.id,()=>{arqs();desenhaAgenda();});}
  f.onsubmit=async ev=>{ev.preventDefault();const turmas=TURMAS.map(t=>t[0]).filter(k=>f['t_'+k].checked);
    if(!turmas.length){msg('Marque pelo menos uma turma.');return;}
    const link=f.link.value.trim();if(link&&!linkOk(link)){msg('O link precisa começar com https://');return;}
    const row={titulo:f.titulo.value.trim()||null,professor:f.professor.value.trim()||null,data:f.data.value,ini:f.ini.value||null,fim:f.fim.value||null,tipo:f.tipo.value,link:link||null,descricao:f.descricao.value.trim()||null,turmas,atualizado_em:new Date().toISOString()};
    const r=novoEv?await SB.from('aulas').insert(row):await SB.from('aulas').update(row).eq('id',a.id);
    if(r.error){msg(r.error.message);return;}fecha();await carregar();desenhaAgenda();};
  const del=dl.querySelector('[data-x=del]');if(del)del.onclick=async()=>{if(!confirm('Excluir este evento da agenda? Os materiais anexados a ele também serão apagados.'))return;
    const L=ARQ.filter(x=>x.aula===a.id);if(L.length)await SB.storage.from('materiais').remove(L.map(x=>x.path));
    const {error}=await SB.from('aulas').delete().eq('id',a.id);if(error){msg(error.message);return;}fecha();await carregar();desenhaAgenda();};}

/* ---------- materiais ---------- */
async function telaMat(pasta){abas('tabMat');$('app').innerHTML='<p class="pend">Carregando os materiais…</p>';
  try{await carregar();}catch(e){$('app').innerHTML=`<div class="card"><p class="pend">${esc(e.message)}</p></div>`;return;}
  if(pasta)abrePasta(pasta);else desenhaPastas();}
function desenhaPastas(){
  const comAula=AULAS.filter(a=>ARQ.some(f=>f.aula===a.id));
  $('app').innerHTML=`<div class="card mhead"><div style="flex:1;min-width:220px"><h2 class="t">Materiais</h2><p class="pend" style="margin:2px 0 0">${IS_ADMIN?'Crie pastas e escolha para quais turmas cada uma fica liberada. Os alunos só veem as pastas da turma deles.':'PDFs, imagens, planejamentos e tudo o que o Prof. Jazz disponibilizar para você.'}</p></div>${IS_ADMIN?'<button class="btn pri" id="novaPasta">+ Nova pasta</button>':''}</div>
   <div class="pastas">${PASTAS.map(p=>{const n=ARQ.filter(f=>f.pasta===p.id).length;return `<button class="pasta" data-p="${p.id}" title="${esc(p.nome)}">${p.capa?`<div class="capa" role="img" aria-label="${esc(p.nome)}" style="background-image:url('${esc(capaURL(p.capa))}')"></div>`:`<div class="capa ph"><i></i></div><div class="ov"><b>${esc(p.nome)}</b>${p.descricao?`<span>${esc(p.descricao)}</span>`:''}<span>${n} arquivo${n===1?'':'s'}</span>${IS_ADMIN?`<div>${tags(p.turmas)}</div>`:''}</div>`}</button>`;}).join('')}
   ${comAula.length?`<button class="pasta aulas" data-p="__aulas"><div class="capa ph"><i></i></div><div class="ov"><b>Materiais das aulas</b><span>Os anexos de cada aula da agenda</span><span>${comAula.length} aula${comAula.length===1?'':'s'} com material</span></div></button>`:''}</div>
   ${!PASTAS.length&&!comAula.length?`<div class="card"><p class="pend" style="margin:0">${IS_ADMIN?'Nenhuma pasta ainda. Clique em “+ Nova pasta” para começar.':'Ainda não há materiais disponíveis para a sua turma.'}</p></div>`:''}`;
  $('app').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>abrePasta(b.dataset.p));
  if(IS_ADMIN)$('novaPasta').onclick=()=>editarPasta(null);}
function abrePasta(id){
  if(id==='__aulas'){const L=AULAS.filter(a=>ARQ.some(f=>f.aula===a.id));
    $('app').innerHTML=`<button class="voltar" id="volta">‹ Todas as pastas</button><div class="card"><h2 class="t">Materiais das aulas</h2><p class="pend" style="margin:2px 0 14px">Os arquivos anexados às aulas da agenda.</p>${L.map(a=>{const d=parse(a.data);return `<h4 style="margin:14px 0 8px;font:700 16px var(--display)">${d.getDate()}/${String(d.getMonth()+1).padStart(2,'0')} · ${esc(titulo(a))}</h4><div class="arqs">${ARQ.filter(f=>f.aula===a.id).map(f=>linhaArq(f,IS_ADMIN)).join('')}</div>`;}).join('')}</div>`;
    $('volta').onclick=desenhaPastas;ligaArqs($('app'),()=>abrePasta('__aulas'));return;}
  const p=PASTAS.find(x=>x.id===id);if(!p){desenhaPastas();return;}const L=ARQ.filter(f=>f.pasta===id);
  $('app').innerHTML=`<button class="voltar" id="volta">‹ Todas as pastas</button>
   <div class="card"><div class="mhead"><div class="phd" style="flex:1;min-width:220px">${p.capa?`<img src="${esc(capaURL(p.capa))}" alt="">`:''}<div><h2 class="t">${esc(p.nome)}</h2>${p.descricao?`<p class="pend" style="margin:2px 0 0">${esc(p.descricao)}</p>`:''}${IS_ADMIN?`<div style="margin-top:6px">${tags(p.turmas)}</div>`:''}</div></div>${IS_ADMIN?'<button class="btn" id="edPasta">Editar pasta</button>':''}</div>
   ${IS_ADMIN?'<div id="upP" style="margin-top:14px"></div>':''}
   <div class="arqs" style="margin-top:14px">${L.length?L.map(f=>linhaArq(f,IS_ADMIN)).join(''):'<p class="pend" style="margin:0">Esta pasta ainda está vazia.</p>'}</div></div>`;
  $('volta').onclick=desenhaPastas;ligaArqs($('app'),()=>abrePasta(id));
  if(IS_ADMIN){zonaUpload($('upP'),'pasta',id,()=>abrePasta(id));$('edPasta').onclick=()=>editarPasta(p);}}
function editarPasta(p){const nova=!p;p=p||{nome:'',descricao:'',turmas:['assessoria','matematica']};
  const [dl,fecha]=dialogo(`<div class="top"><div><h3>${nova?'Nova pasta':'Editar pasta'}</h3></div><button class="x" data-fecha aria-label="Fechar">×</button></div>
   <form class="bd"><label class="f">Nome da pasta<input name="nome" type="text" value="${esc(p.nome)}" placeholder="ex.: Listas de exercícios" required></label>
   <label class="f">Descrição (opcional)<input name="descricao" type="text" value="${esc(p.descricao||'')}" placeholder="ex.: listas semanais de Matemática"></label>
   <div class="f"><b style="font-size:14px">Capa da pasta (formato story do Instagram, 1080 × 1920)</b><div class="capaed"><div class="pv" id="cpPv"${p.capa?` style="background-image:url('${esc(capaURL(p.capa))}')"`:''}>${p.capa?'':'sem capa'}</div><div class="bx"><input type="file" name="capa" accept="image/*"><span class="pend" style="margin:0">Se a imagem tiver outro formato, o site enquadra pelo centro.</span>${p.capa?'<label style="display:inline-flex;gap:6px;align-items:center;font-size:14px"><input type="checkbox" name="semcapa"> Remover a capa</label>':''}</div></div></div>
   <div class="f"><b style="font-size:14px">Quem pode ver esta pasta</b><div class="chk">${TURMAS.map(([k,n])=>`<label><input type="checkbox" name="t_${k}"${p.turmas.includes(k)?' checked':''}> ${n}</label>`).join('')}</div></div>
   <p class="msg"></p><div class="btns"><button class="btn pri" type="submit">${nova?'Criar pasta':'Salvar'}</button><button class="btn" type="button" data-fecha>Cancelar</button>${nova?'':'<button class="btn del" type="button" data-x="del" style="margin-left:auto">Excluir pasta</button>'}</div></form>`);
  const f=dl.querySelector('form'),msg=t=>dl.querySelector('.msg').textContent=t;let blob=null;
  f.capa.onchange=async()=>{const fl=f.capa.files[0];if(!fl)return;try{blob=await prepCapa(fl);const pv=dl.querySelector('#cpPv');pv.style.backgroundImage=`url('${URL.createObjectURL(blob)}')`;pv.textContent='';}catch(e){blob=null;msg('Não consegui ler essa imagem. Use JPG, PNG ou WEBP.');}};
  f.onsubmit=async ev=>{ev.preventDefault();const turmas=TURMAS.map(t=>t[0]).filter(k=>f['t_'+k].checked);if(!turmas.length){msg('Marque pelo menos uma turma.');return;}
    const bt=f.querySelector('[type=submit]');bt.disabled=true;msg('');
    const row={nome:f.nome.value.trim(),descricao:f.descricao.value.trim()||null,turmas};
    const r=nova?await SB.from('pastas').insert({...row,ordem:PASTAS.length}).select().single():await SB.from('pastas').update(row).eq('id',p.id);
    if(r.error){msg(r.error.message);bt.disabled=false;return;}
    const id=nova?r.data.id:p.id;
    if(blob||(f.semcapa&&f.semcapa.checked)){let novaCapa=null;
      if(blob){const path=`${id}/${Date.now()}.jpg`;const up=await SB.storage.from('capas').upload(path,blob,{contentType:'image/jpeg'});if(up.error){msg('A pasta foi salva, mas a capa não: '+up.error.message);bt.disabled=false;return;}novaCapa=path;}
      if(p.capa)await SB.storage.from('capas').remove([p.capa]);
      await SB.from('pastas').update({capa:novaCapa}).eq('id',id);}
    fecha();await carregar();abrePasta(id);};
  const del=dl.querySelector('[data-x=del]');if(del)del.onclick=async()=>{const L=ARQ.filter(x=>x.pasta===p.id);if(!confirm(`Excluir a pasta “${p.nome}”${L.length?' e os '+L.length+' arquivo(s) dentro dela':''}? Não dá para desfazer.`))return;
    if(L.length)await SB.storage.from('materiais').remove(L.map(x=>x.path));if(p.capa)await SB.storage.from('capas').remove([p.capa]);const {error}=await SB.from('pastas').delete().eq('id',p.id);if(error){msg(error.message);return;}fecha();await carregar();desenhaPastas();};}
entrar();
</script>
