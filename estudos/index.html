       <div class="legend">${Object.entries(TIPOS).map(([k,v])=>`<div class="lg"><i style="background:${v[3]}"></i><span>${v[0]}</span><b>${hfmt(T[k]||0)}</b><small>${Math.round(100*(T[k]||0)/tot)}%</small></div>`).join('')}</div></div></div></div>
   <div class="chart"><h3><i class="hi a"></i>Desempenho por matéria</h3><p class="sub">Tempo de estudo, questões feitas, acertos (verde) e erros (vermelho) e o aproveitamento de cada matéria.</p>
     <div style="overflow-x:auto"><table class="mt"><thead><tr><th>Matéria</th><th>Tempo</th><th class="opt"></th><th>Questões</th><th>Acertos × erros</th><th>Aproveitamento</th></tr></thead><tbody>
     ${ML.map(([n,m])=>{const p=m.q?Math.round(100*m.a/m.q):null;const cor=CORM[n]||'#3A8CCB';return `<tr><td><span class="nm"><i style="background:${cor}"></i>${esc(n)}</span></td><td style="white-space:nowrap;font-weight:700">${hfmt(m.s)}</td><td class="opt" style="width:28%"><div class="tbar"><em style="width:${Math.round(100*m.s/smax)}%;background:${cor}"></em></div></td><td style="font-weight:700">${m.q||'—'}</td><td>${m.q?`<div class="ae" title="${m.a} acertos · ${m.e} erros"><span class="a" style="width:${100*m.a/m.q}%"></span><span class="e" style="width:${100*m.e/m.q}%"></span></div><small class="pend">${m.a} ✓ · ${m.e} ✗</small>`:'<small class="pend">sem questões</small>'}</td><td><span class="pc ${pcCls(p)}">${p==null?'—':p+'%'}</span></td></tr>`;}).join('')}</tbody></table></div></div>
   <div class="chart"><h3><i class="hi c"></i>Atividade recente</h3><div class="hoje" style="margin-top:10px">${S.slice(-8).reverse().map(x=>{const [n,ic,,c]=TIPOS[x.tipo];const h=new Date(x.inicio);return `<div class="ses" style="--c:${c}"><span style="font-size:20px">${ic}</span><div class="tx"><b>${esc(x.materia)} · ${esc(n)}</b><span>${dm(h)} às ${String(h.getHours()).padStart(2,'0')}:${String(h.getMinutes()).padStart(2,'0')} · ${esc(x.assunto||'')}${x.questoes?` · ${x.acertos}/${x.questoes} acertos`:''}</span></div><span class="du">${hfmt(x.segundos)}</span></div>`;}).join('')}</div></div>`;
  ligaCab();}
let LALUNOS=null;
function ligaCab(){const s=$('selAl');if(!s)return;s.onchange=()=>telaAlunos(s.value);$('alAnt').onclick=()=>{if(s.selectedIndex>0){s.selectedIndex--;s.onchange();}};$('alProx').onclick=()=>{if(s.selectedIndex<s.options.length-1){s.selectedIndex++;s.onchange();}};}
async function telaAlunos(email){abas('tabAlunos');
  if(!LALUNOS){const {data}=await SB.rpc('admin_lista');LALUNOS=(data||[]).filter(a=>a.email!==ADMIN&&a.email!==EXEMPLO).sort((a,b)=>(b.assessoria-a.assessoria)||(a.nome||a.email).localeCompare(b.nome||b.email,'pt-BR',{sensitivity:'base'}));}
  if(!LALUNOS.length){$('app').innerHTML='<div class="card"><p class="pend">Nenhum aluno cadastrado.</p></div>';return;}
  const al=email&&LALUNOS.find(a=>a.email===email)?email:LALUNOS[0].email;
  const cab=`<div class="card dtop"><h2>Dashboard do aluno</h2><select id="selAl">${LALUNOS.map(a=>`<option value="${esc(a.email)}"${a.email===al?' selected':''}>${esc(a.nome||a.email)}${a.assessoria?'':' (Curso de Matemática)'}</option>`).join('')}</select><button class="btn" id="alAnt">‹</button><button class="btn" id="alProx">›</button></div>`;
  history.replaceState(null,'','?aluno='+encodeURIComponent(al)+'#alunos');
  telaPainel(al,cab);}
entrar();
</script>
