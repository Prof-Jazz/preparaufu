<style>
:root{
  --azul:#3A8CCB; --amarelo:#DDDD24; --grafite:#222322; --laranja:#EB6834; --verde:#1BAF7A;
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#141A2E; --muted:#5C6380; --line:#DDE1EC; --soft:#ECEFF6; --head:#16304F;
  --ok:#1A8A4C; --bad:#D33A2C; --shadow:0 1px 2px rgba(20,26,46,.05),0 6px 20px rgba(20,26,46,.06);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif;
}
:root[data-theme="dark"]{--bg:#0B1020;--card:#151C2E;--ink:#EEF0F7;--muted:#9AA1BD;--line:#262E46;--soft:#1E2740;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--body)}
header{background:var(--head);padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:4px solid var(--amarelo);position:relative}
.logos{display:flex;align-items:center;gap:16px}
.logos img.j{height:46px}.logos img.p{height:34px}
.logos .sep{width:1px;height:40px;background:#55595E}
.ttl{color:#fff}
.ttl h1{font:700 18px/1.2 var(--display);margin:0}
.ttl p{margin:0;color:#BFC5CA;font-size:13.5px}
.tabs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tabs a,.tabs button{font:600 14px var(--body);border:1px solid #4A4F55;background:transparent;color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.tabs .on{background:var(--azul);border-color:var(--azul)}
.theme{display:inline-flex!important;gap:2px;padding:3px!important;border:1px solid #3B5878!important;background:#0E2238!important}
.theme span{width:28px;height:26px;display:grid;place-items:center;border-radius:999px;color:#9FB3CC;font-size:15px}
:root:not([data-theme="dark"]) .theme .sun,:root[data-theme="dark"] .theme .moon{background:#fff;color:#16304F}
@media (max-width:760px){
  header{padding:12px 14px;gap:10px}
  .logos{gap:10px}.logos img.j{height:32px}.logos img.p{height:24px}.logos .sep{height:28px}
  .ttl{flex:1 1 100%}.ttl h1{font-size:17px}.ttl p{font-size:12.5px}
  .tabs{margin-left:0;flex:1 1 100%}
  .tabs a,.tabs button{padding:6px 11px;font-size:13px}
  .tabs .theme{position:absolute;top:13px;right:12px}
  html,body{overflow-x:clip}
}
main.largo{max-width:1280px}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:16px}
.intro{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.intro h2{margin:0 0 6px;font:800 24px var(--display)}
.intro p{margin:0;color:var(--muted)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.sec h3{margin:0;font:700 18px var(--display);display:flex;align-items:center;gap:10px}
.sec h3 .n{width:28px;height:28px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.f{display:flex;flex-direction:column;gap:6px}
.f[hidden]{display:none}
.f>label.q,.f>.q{font-weight:600;font-size:15px}
.f .h{color:var(--muted);font-size:13.5px;margin-top:-3px}
.req{color:var(--laranja)}
input[type=search],input[type=text],input[type=tel],input[type=number],input[type=time],input[type=email],input[type=password],select,textarea{font:500 15px var(--body);padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:76px;resize:vertical}
input[type=time]{max-width:160px}input[type=number]{max-width:160px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14.5px}
.opts label:has(input:checked){border-color:var(--azul);background:rgba(58,140,203,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.grid{border-collapse:collapse;width:100%;font-size:14px}
.grid th,.grid td{border:1px solid var(--line);padding:6px 4px;text-align:center}
.grid th{background:var(--soft);font-weight:600}
.grid td:first-child{text-align:left;padding-left:8px;font-weight:600;white-space:nowrap}
.grid input{width:20px;height:20px;cursor:pointer;accent-color:var(--azul)}
.scale{display:grid;grid-template-columns:minmax(120px,1fr) repeat(4,minmax(58px,76px));gap:6px;align-items:center;font-size:14.5px}
.scale .hd{color:var(--muted);font-size:12.5px;text-align:center}
.scale label{display:grid;place-items:center}
.scale input{width:20px;height:20px;accent-color:var(--azul)}
@media (max-width:480px){.scale{grid-template-columns:minmax(92px,1fr) repeat(4,52px);font-size:13.5px}.scale .hd{font-size:11px}}
.btn{font:600 15px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 16px;border-radius:9px;cursor:pointer}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.send{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#msg{font-size:14.5px}#msg.ok{color:var(--ok)}#msg.err{color:var(--bad)}
.done{border-left:5px solid var(--verde)}
.aviso{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.aviso h2{font:800 22px var(--display);margin:0 0 8px}.aviso p{color:var(--muted);margin:0 0 16px}
.aviso a{color:#fff;background:var(--azul);padding:10px 18px;border-radius:9px;text-decoration:none;font-weight:600}
.fx{display:flex;flex-direction:column;gap:10px}
.fxl{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fxt{display:grid;grid-template-columns:200px 1fr 34px;gap:8px}
.fxt select,.fxt input,.fxh input{background:var(--card)}
.fx-del{border:1px solid var(--line);background:var(--card);color:var(--bad);border-radius:8px;cursor:pointer;font-size:15px}
.fxd{display:flex;flex-wrap:wrap;gap:6px}
.fxd label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13.5px;cursor:pointer;background:var(--card)}
.fxd label:has(input:checked){border-color:var(--azul);background:rgba(58,140,203,.16)}
.fxh{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.fxh input{max-width:130px}
@media (max-width:560px){.fxt{grid-template-columns:1fr 34px}.fxt .fx-desc{grid-column:1/-1;grid-row:2}}
.kps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kp b{font:800 20px var(--display);line-height:1.15}.kp span{color:var(--muted);font-size:13px}
.alu .kp{background:var(--bg)}
@media (max-width:560px){.kps{grid-template-columns:repeat(2,minmax(0,1fr))}.kp b{font-size:17px}.alu .kp b{font-size:15px}}.alu .kp b{font-size:16px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.gc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.gc h4{margin:0 0 4px;font:700 15px var(--display)}.gs{margin:-6px 0 2px;color:var(--muted);font-size:12.5px}
.br{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(60px,1fr) 42px 26px;gap:8px;align-items:center;font-size:13.5px}
.bl{line-height:1.25}
.bt{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}.bt i{display:block;height:100%;border-radius:99px}
.br b{text-align:right;font-variant-numeric:tabular-nums}.br small{color:var(--muted);text-align:right}
.heat{border-collapse:collapse;width:100%;font-size:13px}.heat th,.heat td{border:1px solid var(--line);padding:5px;text-align:center}.heat td:first-child{text-align:left;font-weight:600}
.ag{display:grid;grid-template-columns:38px repeat(7,minmax(70px,1fr));gap:0 3px;overflow-x:auto;font-size:11.5px;margin-top:4px}
.agh{text-align:center;font-weight:700;padding:4px 0;color:var(--muted)}
.agt{position:relative}.agt span{position:absolute;right:4px;transform:translateY(-50%);color:var(--muted);font-size:10.5px}
.agc{position:relative;background:repeating-linear-gradient(to bottom,var(--soft) 0 1px,transparent 1px 40px);border-radius:6px;background-color:var(--bg)}
.ev{position:absolute;left:2px;right:2px;border-radius:6px;overflow:hidden;padding:5px 7px;line-height:1.2;box-sizing:border-box}
.ev.fx1{display:flex;flex-direction:column;gap:1px}.ev.fx1 b{font-size:11.5px}.ev .hr{font-size:10.5px;opacity:.95}
.ev.f2{padding:3px 6px;line-height:1.12}.ev.f2 b{font-size:10.5px}.ev.f3{display:block}.ev.f3 b{margin-right:3px}.ev.f3 .hr{display:inline-block}.ev.f4{padding:2px 5px;font-size:9.5px;line-height:1.1}.ev.f4 b,.ev.f4 .hr{font-size:9.5px}
.ev.sono{background:repeating-linear-gradient(45deg,rgba(120,130,160,.28) 0 6px,rgba(120,130,160,.12) 6px 12px);color:var(--muted);left:0;right:0;border-radius:0;font-size:10.5px}
.ev.livre{border:2px dashed var(--verde);background:rgba(27,175,122,.08);left:0;right:0}
.ev.fx1{color:#fff;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:2}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.leg i.sono{background:rgba(120,130,160,.4)}.leg i.livre{border:2px dashed var(--verde)}
#printArea{display:none}
body.imprimindo>*:not(#printArea){display:none!important}
body.imprimindo{background:#fff}
body.imprimindo #printArea{display:block;width:1040px;margin:0 auto;padding:4px;background:#fff;color:#111}
#printArea .phead{display:flex;justify-content:space-between;align-items:baseline;margin:0 0 6px;font:800 17px var(--display)}#printArea .phead span{font:600 12px var(--body);color:#555}
#printArea .cgw{overflow:visible;margin:0;display:block!important}#printArea .cg{min-width:0;grid-template-columns:34px repeat(7,minmax(0,1fr))}
#printArea .cgc{cursor:default}#printArea .cb{box-shadow:none}
#printArea *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
@media print{@page{size:A4 landscape;margin:8mm}}
.cgc{cursor:copy}
.cbanner{background:rgba(221,221,36,.14);border:1px solid var(--amarelo);border-radius:12px;padding:12px 14px;font-size:15px}
.caviso{background:rgba(235,104,52,.12);border:1px solid var(--laranja);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:8px}
.cgw{overflow-x:auto;margin-top:12px}
.cg{display:grid;grid-template-columns:40px repeat(7,minmax(118px,1fr));gap:0 4px;min-width:900px}
.cgh{text-align:center;font:700 13px var(--display);padding:6px 0;color:var(--muted)}
.cgt{position:relative}.cgt span{position:absolute;right:5px;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.cgc{position:relative;border-radius:8px;background-color:var(--bg);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px)}
.cb{position:absolute;left:3px;right:3px;border-radius:8px;padding:6px 9px;overflow:hidden;font-size:12px;line-height:1.22;display:flex;flex-direction:column;gap:1px;box-shadow:0 1px 2px rgba(0,0,0,.2);box-sizing:border-box}
.cb b{font-weight:700;font-size:12.5px}
.cb .ds,.ev .ds{font-style:normal;font-size:11.5px;opacity:.85}.cb .hr,.ev .hr{white-space:nowrap}.cb .hr{font-size:11.5px;opacity:.95;font-variant-numeric:tabular-nums}
.cb.f1 .ds,.ev.f1 .ds{display:none}
.cb.f2{padding:4px 8px;line-height:1.15;font-size:11.5px}.cb.f2 b{font-size:11.5px}.cb.f2 .hr{font-size:11px}
.cb.f3{display:block}.cb.f3 b{margin-right:4px}.cb.f3 .hr{display:inline-block;white-space:nowrap}
.cb.f4{padding:3px 6px;font-size:10.5px;line-height:1.1}.cb.f4 b,.cb.f4 .hr{font-size:10.5px}
.cb.f5.f5{padding:0 6px;font-size:9.5px;line-height:1.05;display:flex;flex-direction:row;align-items:center;gap:4px;white-space:nowrap}.cb.f5 b,.cb.f5 .hr{font-size:9.5px}

.cb.fixo,.cli.fixo{background:repeating-linear-gradient(45deg,var(--soft) 0 6px,var(--card) 6px 12px);color:var(--muted);box-shadow:none;border:1px solid var(--line)}
.cb.prepara,.cli.prepara{background:#16304F;color:#fff;border:2px solid var(--amarelo)}
.cb.sim,.cli.sim{background:#212529;color:#fff;border:2px solid var(--amarelo)}
.cb.rev,.cli.rev{background:var(--card);color:var(--ink);border:2px solid #868E96}
.clw{display:none}
@media (max-width:760px){.cgw{display:none}.clw{display:flex;flex-direction:column;gap:10px;margin-top:12px}}
.cl h5{margin:0 0 6px;font:700 15px var(--display)}
.cli{display:flex;gap:10px;align-items:center;border-radius:9px;padding:8px 10px;margin-bottom:5px;font-size:14px}

.cleg{margin-top:10px}
.cr{border-collapse:collapse;width:100%;font-size:14px}.cr th,.cr td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.cr th{color:var(--muted);font-weight:600;font-size:12.5px}.cr td i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.cr .tt td{font-weight:700}.falt{color:var(--laranja);font-size:12.5px}
@media print{header,.tabs,.intro,.btn{display:none!important}body{background:#fff;color:#000}.sec{border:0;box-shadow:none}.cgw{overflow:visible}.cb{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.ctb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}

@media (max-width:760px){.sodesk{display:none}.somob{display:inline}}

@media print{.ctb,.chint,.cdlg{display:none!important}}

#exBar[hidden]{display:none}

.exacoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(221,221,36,.12);border:1px dashed var(--amarelo);border-radius:12px;padding:10px 14px;font-size:14px}

function horasDia(p){const o={};if(p.horas_dia&&Object.keys(p.horas_dia).length){DS.forEach(d=>o[d]=hnum(p.horas_dia[d]));return o;}

const hnum=v=>{if(!v||v==='Não estudo')return 0;if(v==='Menos de 1 h')return .5;const m=v.match(/(\d+) h(?: (\d+))?/);return m?+m[1]+(m[2]?+m[2]/60:0):0;};
const hfmt=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return M?`${H} h ${String(M).padStart(2,'0')}`:`${H} h`;};
const tmin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m;};
const mfmt=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};

function fmt(f,v){
  if(v==null||v===''||(Array.isArray(v)&&!v.length))return '';
  if(f.type==='grid'){return DIAS.map(d=>{const t=TURNOS.filter(t=>v.includes(d+'|'+t));return t.length?d+': '+t.join(', '):'';}).filter(Boolean).join('\n');}
  if(f.type==='horasdia')return DS.map(d=>d+': '+((v||{})[d]||'—')).join(' · ');
  if(f.type==='fixos')return v.map(x=>`${x.tipo}${x.desc?' ('+x.desc+')':''}: ${x.dias.join(', ')} · ${x.ini||'?'}–${x.fim||'?'}`).join('\n');
  if(f.type==='scale')return AREAS.map(a=>a+': '+(v[a]?DIFN[v[a]-1]:'—')).join('\n');
  return Array.isArray(v)?v.join(', '):String(v);}

  document.body.appendChild(dlg);const f=dlg.querySelector('form');

  const durTxt=()=>{const a=tmin(f.ini.value),z=tmin(f.fim.value);dlg.querySelector('.cdur').textContent=a!=null&&z!=null&&z>a?`Duração: ${z-a} min`:'';};f.ini.addEventListener('input',durTxt);f.fim.addEventListener('input',durTxt);durTxt();
  const fecha=()=>dlg.remove();dlg.onclick=ev=>{if(ev.target===dlg)fecha();};
  dlg.querySelector('[data-x=cancel]').onclick=fecha;
  const unica=()=>b&&(GRUPO[b.k])&&st.B.filter(x=>x.k===b.k).length===1;
  const del=dlg.querySelector('[data-x=del]');if(del)del.onclick=()=>{if(unica()){f.querySelector('.cerr').textContent=`Esta é a única vez que ${b.label} aparece na semana. Toda matéria precisa aparecer pelo menos uma vez: em vez de excluir, mude o dia ou o horário.`;return;}if(!confirm('Excluir este bloco?'))return;st.B=st.B.filter(x=>x!==b);fecha();desenhar(st);salvar(st);};
  f.onsubmit=ev=>{ev.preventDefault();const ini=tmin(f.ini.value),fim=tmin(f.fim.value);
    if(b&&f.k.value!==b.k&&unica()){f.querySelector('.cerr').textContent=`Esta é a única vez que ${b.label} aparece na semana. Para estudar outra matéria, adicione um bloco novo em vez de trocar este.`;return;}
    if(ini==null||fim==null||fim<=ini){f.querySelector('.cerr').textContent='O horário de término precisa ser depois do início.';return;}
    const k=f.k.value,nome=(ops.find(o=>o[0]===k)||[])[1];if(k==='OUT'&&!f.nome.value.trim()){f.querySelector('.cerr').textContent='Escreva o nome da atividade.';return;}
    const nb={id:b?b.id:Math.max(0,...st.B.map(x=>+x.id||0))+1,d:f.d.value,ini,fim,
      tipo:k==='REV'?'rev':k==='SIM'?'sim':k==='RED'?'red':'estudo',k,
      label:k==='OUT'?f.nome.value.trim():k==='SIM'?SIMLBL:k==='REV'?(b&&b.tipo==='rev'?b.label:'Revisão'):nome};
    if(b)Object.assign(b,nb);else st.B.push(nb);fecha();desenhar(st);salvar(st);};}

  <div class="cadbox"><h3>Liberar aluno</h3><p class="pend" style="margin:0">O aluno entra pela primeira vez em “Primeiro acesso? Crie sua senha”, com o e-mail liberado aqui. Todo aluno liberado tem o Banco de Questões; marque “Assessoria” para ele ter também esta área.</p>

  $('app').querySelectorAll('button[data-z]').forEach(b=>b.onclick=async()=>{const e=b.dataset.z;if(!confirm('Zerar a senha de '+e+'? O aluno vai criar uma nova em “Primeiro acesso”.'))return;const {error}=await SB.rpc('admin_zerar_senha',{e});await cadLoad(error?error.message:'Senha zerada: '+e);});
  $('app').querySelectorAll('button[data-r]').forEach(b=>b.onclick=async()=>{const e=b.dataset.r;if(!confirm('Remover o acesso de '+e+'? Ele perde o Banco de Questões e a Assessoria.'))return;await SB.rpc('admin_zerar_senha',{e});const {error}=await SB.from('allowed_emails').delete().eq('email',e);await cadLoad(error?error.message:'Acesso removido: '+e);});}

  const lingua=(k.data&&k.data.respostas&&k.data.respostas.lingua)||'';
  const itens=PLANO.filter(x=>!(x.materia==='Inglês'&&lingua==='Espanhol')&&!(x.materia==='Espanhol'&&lingua==='Inglês'));
  const sem=[...new Set(itens.map(x=>x.semana))].sort();

function segDe(d){const x=new Date(d.getFullYear(),d.getMonth(),d.getDate());x.setDate(x.getDate()-((x.getDay()+6)%7));return x;}
let XLSXP=null;function xlsxLib(){if(window.XLSX)return Promise.resolve(window.XLSX);if(!XLSXP)XLSXP=new Promise((ok,no)=>{const s=document.createElement('script');s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';s.onload=()=>ok(window.XLSX);s.onerror=()=>no(new Error('não foi possível carregar o leitor de Excel'));document.head.appendChild(s);});return XLSXP;}

function lerData(v){if(v instanceof Date&&!isNaN(v)){const d=new Date(v.getTime()+12*3600e3);return new Date(d.getFullYear(),d.getMonth(),d.getDate());}
  if(typeof v==='number'){const d=new Date(Math.round((v-25569)*864e5)+12*3600e3);return new Date(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate());}
  const t=String(v||'').trim();let m=t.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/);if(m){let y=+m[3];if(y<100)y+=2000;return new Date(y,+m[2]-1,+m[1]);}
  m=t.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return new Date(+m[1],+m[2]-1,+m[3]);return null;}
async function subirPlano(file,P,msg){msg('Lendo a planilha…');const X=await xlsxLib();const wb=X.read(await file.arrayBuffer(),{cellDates:true});

  let h=L.findIndex(r=>String(r[0]).toLowerCase().includes('semana'));const dados=L.slice(h+1);const rows=[],erros=[];
  dados.forEach((r,i)=>{if(r.every(c=>String(c).trim()===''))return;const d=lerData(r[0]),mat=String(r[1]||'').trim(),ass=String(r[3]||'').trim();
    if(!d||!mat||!ass){erros.push(h+i+2);return;}rows.push({email:ALVO,semana:isoD(segDe(d)),materia:mat,frente:String(r[2]||'').trim()||null,assunto:ass,obs:String(r[4]||'').trim()||null});});
  if(!rows.length){msg('Não encontrei nenhum assunto na planilha. Use o modelo (colunas: Semana, Matéria, Frente, Assunto, Observação).');return;}
  const sems=[...new Set(rows.map(r=>r.semana))].sort();
  if(!confirm(`Encontrei ${rows.length} assuntos em ${sems.length} semana(s), de ${brData(sems[0])} a ${brData(sems[sems.length-1])}.${erros.length?`\n\n${erros.length} linha(s) ficaram de fora por falta de semana, matéria ou assunto (linhas ${erros.slice(0,8).join(', ')}${erros.length>8?'…':''}).`:''}\n\nIsso SUBSTITUI o plano atual de ${ANOME} (${P.itens.length} assuntos e as marcações de estudado). Continuar?`)){msg('');return;}
  msg('Salvando…');const del=await SB.from('m_plano').delete().eq('email',ALVO);if(del.error){msg('Erro: '+del.error.message);return;}
  for(let i=0;i<rows.length;i+=400){const {error}=await SB.from('m_plano').insert(rows.slice(i,i+400));if(error){msg('Erro: '+error.message);return;}}

  if(avisa){const proprio=EMAIL===ALVO;const k='bqufu-aviso-venc-'+ALVO;let ja=null;try{ja=proprio?sessionStorage.getItem(k):null;}catch(e){}

      mdlg(`<div class="mtop" style="--c:${sv.tipo==='vencido'?'#E5484D':'#C9A227'}"><h3>${sv.tipo==='vencido'?'Hora de renovar a sua mentoria':'Sua mentoria está vencendo'}</h3><p>Mentoria Individual · Prof. Jazz</p></div><div class="mfm"><p style="margin:0;font-size:16px;line-height:1.55">${nm?esc(nm)+', o':'O'} seu plano da Mentoria Individual <b>${quandoVence(M.vencimento)}</b>.${M.valor!=null?` O valor da renovação é de <b>${brl(M.valor)}</b>.`:''}</p><p style="margin:0;color:var(--muted)">Para continuar com o seu plano de estudos, os encontros e todo o acompanhamento, fale com o Prof. Jazz para renovar. Seguimos juntos rumo à aprovação!</p><div class="mbt"><button class="btn pri" data-fecha>Entendi</button></div></div>`,sv.tipo==='vencido'?'#E5484D':'#C9A227');}}

async function telaEnc(){abas('tabEnc');$('app').innerHTML='<p class="pend">Carregando…</p>';
  const {data,error}=await SB.from('m_encontros').select('*').eq('email',ALVO).order('data').order('ini');if(error){$('app').innerHTML=`<div class="aviso"><p>${esc(error.message)}</p></div>`;return;}
  const hoje=isoD(new Date()),E=data||[],fut=E.filter(e=>e.data>=hoje),pas=E.filter(e=>e.data<hoje).reverse();
  const item=(e,futuro)=>`<article class="menc${futuro?' fut':''}"><span class="mdia"><b>${pData(e.data).getDate()}</b><small>${MESL[pData(e.data).getMonth()].slice(0,3)}</small></span><div class="mtx"><b>${e.data===hoje?'Hoje':esc(dataLonga(e.data))}${e.ini?` · ${hhm(e.ini)}${e.fim?'–'+hhm(e.fim):''}`:''}</b><span>${esc(e.titulo||'Encontro de mentoria')}</span>
     ${e.combinados?`<div class="mcomb"><small>Combinados</small><p>${esc(e.combinados)}</p></div>`:''}
     <div class="mbt">${futuro&&linkOk(e.link)?`<a class="btn pri" href="${esc(e.link.trim())}" target="_blank" rel="noopener" style="text-decoration:none">🎥 Entrar no encontro</a>`:''}${IS_ADMIN?`<button class="btn" data-ed="${e.id}">✎ Alterar</button><button class="btn" data-del="${e.id}">Excluir</button>`:''}</div></div></article>`;
  $('app').innerHTML=`<div class="intro"><h2>Encontros</h2><p>${IS_ADMIN?`Os encontros de mentoria de ${esc(ANOME)}. O aluno vê a data, o horário, o assunto, o link da reunião e os combinados.`:'Os seus encontros de mentoria com o Prof. Jazz. No dia, entre pelo botão “Entrar no encontro”. Os combinados de cada encontro ficam registrados aqui.'}</p>${IS_ADMIN?'<button class="btn pri" id="encNovo" style="margin-top:10px">+ Marcar encontro</button>':''}</div>
   <h3 class="msub">Próximos</h3>${fut.map(e=>item(e,true)).join('')||'<p class="pend">Nenhum encontro marcado.</p>'}
   ${pas.length?`<h3 class="msub">Encontros anteriores</h3>${pas.map(e=>item(e,false)).join('')}`:''}`;
  if(IS_ADMIN){$('encNovo').onclick=()=>editaEnc(null);$('app').querySelectorAll('[data-ed]').forEach(b=>b.onclick=()=>editaEnc(E.find(e=>e.id===+b.dataset.ed)));

function editaEnc(e){const novo=!e;e=e||{data:isoD(new Date()),ini:'19:00',fim:'20:00'};
  const [d,fecha]=mdlg(`<div class="mtop"><h3>${novo?'Marcar encontro':'Alterar encontro'}</h3><p>${esc(ANOME)}</p></div>
   <form class="mfm"><div class="m3"><label>Data<input type="date" name="data" value="${esc(e.data)}" required></label><label>Início<input type="time" name="ini" value="${esc(hhm(e.ini))}"></label><label>Fim<input type="time" name="fim" value="${esc(hhm(e.fim))}"></label></div>
   <label>Assunto do encontro<input name="titulo" value="${esc(e.titulo||'')}" placeholder="ex.: revisão do cronograma e da semana 3"></label>
   <label>Link da reunião (Meet, Zoom…)<input name="link" value="${esc(e.link||'')}" placeholder="https://meet.google.com/…"></label>
   <label>Combinados <small>(o aluno vê; preencha depois do encontro)</small><textarea name="combinados" rows="4">${esc(e.combinados||'')}</textarea></label>
   <p class="mmsg"></p><div class="mbt"><button class="btn pri" type="submit">Salvar</button><button class="btn" type="button" data-fecha>Cancelar</button></div></form>`);
  const f=d.querySelector('form');f.onsubmit=async ev=>{ev.preventDefault();const row={email:ALVO,data:f.data.value,ini:f.ini.value||null,fim:f.fim.value||null,titulo:f.titulo.value.trim()||null,link:f.link.value.trim()||null,combinados:f.combinados.value.trim()||null};
    if(row.link&&!linkOk(row.link)){d.querySelector('.mmsg').textContent='O link precisa começar com https://';return;}
    const {error}=novo?await SB.from('m_encontros').insert(row):await SB.from('m_encontros').update(row).eq('id',e.id);
    if(error){d.querySelector('.mmsg').textContent=error.message;return;}fecha();telaEnc();};}

const kb=n=>n>1048576?(n/1048576).toFixed(1).replace('.',',')+' MB':Math.max(1,Math.round(n/1024))+' KB';
const icoArq=t=>/pdf/.test(t)?'📕':/image/.test(t)?'🖼':/sheet|excel|csv/.test(t)?'📊':/word|document/.test(t)?'📝':/video/.test(t)?'🎬':/audio/.test(t)?'🎧':/presentation|powerpoint/.test(t)?'📽':'📄';
async function telaMat(){abas('tabMat');await listaPastas(false);}
async function telaGerais(){abas('tabGerais');await listaPastas(true);}
async function listaPastas(gerais){$('app').innerHTML='<p class="pend">Carregando…</p>';
  const [p,a]=await Promise.all([SB.from('m_pastas').select('*').order('criado'),SB.from('m_arquivos').select('pasta')]);
  const cnt={};(a.data||[]).forEach(x=>cnt[x.pasta]=(cnt[x.pasta]||0)+1);
  const L=(p.data||[]).filter(x=>gerais?!x.email:(!x.email||x.email===ALVO)).sort((x,y)=>(x.email?0:1)-(y.email?0:1));
  $('app').innerHTML=`<div class="intro"><h2>${gerais?'Materiais para todos os mentorados':'Materiais'}</h2><p>${gerais?'Pastas que aparecem para todos os alunos da mentoria individual.':IS_ADMIN?`Pastas só de ${esc(ANOME)} e as pastas para todos os mentorados.`:'Os seus materiais da mentoria: os arquivos só seus e os materiais para todos os alunos da mentoria.'}</p>${IS_ADMIN?`<button class="btn pri" id="pNova" style="margin-top:10px">+ Nova pasta ${gerais?'para todos':'só para '+esc((ANOME||'').split(' ')[0])}</button>`:''}</div>
   <div class="mpastas">${L.map(x=>`<button class="mpasta" data-p="${x.id}"><span class="mpi">📁</span><b>${esc(x.nome)}</b>${x.descricao?`<small>${esc(x.descricao)}</small>`:''}<span class="mpc">${cnt[x.id]||0} arquivo(s) · ${x.email?'só '+(IS_ADMIN?'deste aluno':'sua'):'para todos'}</span></button>`).join('')||'<p class="pend">Nenhuma pasta ainda.</p>'}</div>`;
  if(IS_ADMIN)$('pNova').onclick=()=>editaPasta(null,gerais);
  $('app').querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>abrePastaM(L.find(x=>x.id===b.dataset.p),gerais));}
function editaPasta(p,gerais){const novo=!p;
  const [d,fecha]=mdlg(`<div class="mtop"><h3>${novo?'Nova pasta':'Alterar pasta'}</h3><p>${(p?!p.email:gerais)?'Para todos os mentorados':'Só para '+esc(ANOME)}</p></div><form class="mfm"><label>Nome da pasta<input name="nome" value="${esc(p?p.nome:'')}" required></label><label>Descrição <small>(opcional)</small><input name="descricao" value="${esc(p&&p.descricao||'')}"></label><p class="mmsg"></p><div class="mbt"><button class="btn pri" type="submit">Salvar</button><button class="btn" type="button" data-fecha>Cancelar</button></div></form>`);
  const f=d.querySelector('form');f.onsubmit=async ev=>{ev.preventDefault();const row={nome:f.nome.value.trim(),descricao:f.descricao.value.trim()||null};if(novo)row.email=gerais?null:ALVO;
    const r=novo?await SB.from('m_pastas').insert(row).select().single():await SB.from('m_pastas').update(row).eq('id',p.id).select().single();
    if(r.error){d.querySelector('.mmsg').textContent=r.error.message;return;}fecha();abrePastaM(r.data,gerais);};}
async function abrePastaM(p,gerais){$('app').innerHTML='<p class="pend">Carregando…</p>';
  const {data}=await SB.from('m_arquivos').select('*').eq('pasta',p.id).order('criado',{ascending:false});const L=data||[];
  $('app').innerHTML=`<div class="intro"><button class="btn" id="pVolta">‹ Voltar</button><h2 style="margin-top:10px">📁 ${esc(p.nome)}</h2>${p.descricao?`<p>${esc(p.descricao)}</p>`:''}${IS_ADMIN?`<div class="mbt" style="margin-top:10px"><label class="btn pri">⬆ Enviar arquivos<input type="file" multiple hidden id="pUp"></label><button class="btn" id="pEd">✎ Alterar pasta</button><button class="btn" id="pDel">Excluir pasta</button></div><p class="mmsg" id="pMsg"></p>`:''}</div>
   <div class="marqs">${L.map(f=>`<div class="marq"><span class="mai">${icoArq(f.tipo||'')}</span><div><b>${esc(f.nome)}</b><small>${kb(f.tamanho||0)} · ${new Date(f.criado).toLocaleDateString('pt-BR')}</small></div><button class="btn" data-abre="${esc(f.path)}">Abrir</button>${IS_ADMIN?`<button class="btn" data-rm="${f.id}">Excluir</button>`:''}</div>`).join('')||'<p class="pend">Esta pasta ainda está vazia.</p>'}</div>`;
  $('pVolta').onclick=()=>gerais?telaGerais():telaMat();
  $('app').querySelectorAll('[data-abre]').forEach(b=>b.onclick=async()=>{const w=window.open('','_blank');const {data,error}=await SB.storage.from('mentoria').createSignedUrl(b.dataset.abre,3600);if(error||!data){if(w)w.close();alert('Não foi possível abrir: '+(error?error.message:''));return;}if(w)w.location=data.signedUrl;else location.href=data.signedUrl;});
  if(!IS_ADMIN)return;
  $('pEd').onclick=()=>editaPasta(p,gerais);
  $('pDel').onclick=async()=>{if(!confirm(`Excluir a pasta “${p.nome}” e os ${L.length} arquivo(s) dela? Não dá para desfazer.`))return;if(L.length)await SB.storage.from('mentoria').remove(L.map(f=>f.path));await SB.from('m_pastas').delete().eq('id',p.id);gerais?telaGerais():telaMat();};
  $('app').querySelectorAll('[data-rm]').forEach(b=>b.onclick=async()=>{const f=L.find(x=>x.id===b.dataset.rm);if(!confirm('Excluir “'+f.nome+'”?'))return;await SB.storage.from('mentoria').remove([f.path]);await SB.from('m_arquivos').delete().eq('id',f.id);abrePastaM(p,gerais);});
  $('pUp').onchange=async ev=>{const fs=[...ev.target.files];if(!fs.length)return;const msg=t=>$('pMsg').textContent=t;
    for(let i=0;i<fs.length;i++){const f=fs[i];if(f.size>200*1048576){msg(`“${f.name}” passa de 200 MB e ficou de fora.`);continue;}msg(`Enviando ${i+1} de ${fs.length}: ${f.name}…`);
      const limpo=f.name.normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/[^\w.\-]+/g,'_');const path=`${p.email||'geral'}/${p.id}/${Date.now()}-${limpo}`;
      const up=await SB.storage.from('mentoria').upload(path,f,{contentType:f.type||'application/octet-stream'});if(up.error){msg('Erro ao enviar '+f.name+': '+up.error.message);return;}
      const {error}=await SB.from('m_arquivos').insert({pasta:p.id,path,nome:f.name,tipo:f.type||'',tamanho:f.size});if(error){msg('Erro: '+error.message);return;}}
    abrePastaM(p,gerais);};}

/* ---------- entrada ---------- */
async function entrar(){const {data:{session}}=await SB.auth.getSession();if(!session){location.replace('/?volta='+encodeURIComponent(location.pathname+location.hash));return;}
  EMAIL=(session.user.email||'').toLowerCase();IS_ADMIN=EMAIL===ADMIN;IS_STAFF=IS_ADMIN;$('gate').hidden=true;
  const {data:ar}=await SB.rpc('minhas_areas');
  if(!ar||!ar.mentoria){$('app').innerHTML=`<div class="aviso"><h2>Área da Mentoria Individual</h2><p>Esta área é exclusiva dos alunos da mentoria individual com o Prof. Jazz.</p><p><a class="btn pri" href="/" style="text-decoration:none">Voltar ao início</a></p></div>`;return;}
  window.AMBAS=!!(ar.turma&&ar.mentoria);$('lkAreas').hidden=!AMBAS;
  ALVO=EMAIL;
  $('tabResp').onclick=telaMentorados;$('tabCad').onclick=telaCad;$('tabGerais').onclick=telaGerais;$('tabInicio').onclick=telaInicio;$('tabRaio').onclick=telaRaio;$('tabDash').onclick=telaDash;$('tabPlano').onclick=()=>telaPlano();$('tabCrono').onclick=telaCrono;$('tabEnc').onclick=telaEnc;$('tabMat').onclick=telaMat;$('tabForm').onclick=telaForm;$('tabFaq').onclick=telaFaq;
  $('exSair').onclick=saiAluno;$('exTroca').onclick=saiAluno;
  $('hdVolta').onclick=saiAluno;$('hdPuro').onclick=()=>$('exPuro').click();
  $('exPuro').onclick=()=>{const atual=MTABS.find(t=>$(t).classList.contains('on'));PURO=!PURO;IS_ADMIN=!PURO;try{PURO?sessionStorage.setItem('bqufu-mentoria-puro','1'):sessionStorage.removeItem('bqufu-mentoria-puro');}catch(e){}menuM();const mapa={tabInicio:telaInicio,tabDash:telaDash,tabPlano:()=>telaPlano(),tabCrono:telaCrono,tabEnc:telaEnc,tabMat:telaMat,tabForm:telaForm,tabFaq:telaFaq};(mapa[atual]||telaInicio)();window.scrollTo(0,0);};
  if(IS_ADMIN){let v=null;try{v=JSON.parse(sessionStorage.getItem('bqufu-mentoria-ver')||'null');}catch(e){}let pu=null;try{pu=sessionStorage.getItem('bqufu-mentoria-puro');}catch(e){}
    if(v&&v.email&&pu){PURO=true;IS_ADMIN=false;entraAluno(v.email,v.nome);return;}
    try{sessionStorage.removeItem('bqufu-mentoria-ver');sessionStorage.removeItem('bqufu-mentoria-puro');}catch(e){}menuM();telaMentorados();}
  else{const {data:me}=await SB.from('mentorados').select('nome').eq('email',EMAIL).maybeSingle();ANOME=me?me.nome:'';menuM();telaInicio();}}
entrar();
</script>
