<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<meta name="theme-color" content="#16304F">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sala de Estudos · PREPARA UFU</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#3A8CCB; --amarelo:#DDDD24; --grafite:#222322; --laranja:#EB6834; --verde:#1BAF7A; --roxo:#7B4FC9; --verm:#D9434F;
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#141A2E; --muted:#5C6380; --line:#DDE1EC; --soft:#ECEFF6; --head:#16304F;
  --ok:#1A8A4C; --bad:#D33A2C; --shadow:0 1px 2px rgba(20,26,46,.05),0 6px 20px rgba(20,26,46,.06);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif;
  --t-teoria:#3A8CCB; --t-questoes:#EB6834; --t-revisao:#1BAF7A; --t-correcao:#7B4FC9;
}
:root[data-theme="dark"]{--bg:#0B1020;--card:#151C2E;--ink:#EEF0F7;--muted:#9AA1BD;--line:#262E46;--soft:#1E2740;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--body);animation:fadein .25s ease}
@keyframes fadein{from{opacity:0}to{opacity:1}}
header{background:var(--head);padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:4px solid var(--amarelo);position:relative}
.logos{display:flex;align-items:center;gap:16px;text-decoration:none}
.logos img.j{height:46px}.logos img.p{height:34px}
.logos .sep{width:1px;height:40px;background:#55595E}
.tabs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tabs a,.tabs button{font:600 14px var(--body);border:1px solid #4A4F55;background:transparent;color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.tabs .am{border-color:var(--amarelo);color:var(--amarelo)}
.theme{display:inline-flex!important;gap:2px;padding:3px!important;border:1px solid #3B5878!important;background:#0E2238!important}
.theme span{width:28px;height:26px;display:grid;place-items:center;border-radius:999px;color:#9FB3CC;font-size:15px}
:root:not([data-theme="dark"]) .theme .sun,:root[data-theme="dark"] .theme .moon{background:#fff;color:#16304F}
@media (max-width:760px){header{padding:12px 14px;gap:10px}.logos{gap:10px}.logos img.j{height:32px}.logos img.p{height:24px}.logos .sep{height:28px}
  .tabs{margin-left:0;flex:1 1 100%}.tabs a,.tabs button{padding:6px 11px;font-size:13px}.tabs .theme{position:absolute;top:13px;right:12px}html,body{overflow-x:clip}}
.subnav{position:sticky;top:0;z-index:25;background:var(--card);border-bottom:1px solid var(--line)}
.subnav .in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;align-items:center}
.subnav button{flex:none;font:600 14px var(--body);border:0;background:transparent;color:var(--muted);padding:9px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.subnav button:hover{color:var(--ink);background:var(--soft)}.subnav button.on{background:var(--azul);color:#fff}
#exBar{background:var(--amarelo);color:#16304F;font:600 14px var(--body);padding:8px 16px;text-align:center;position:sticky;top:52px;z-index:24}
#exBar[hidden]{display:none}#exBar button{margin-left:10px;font:700 13px var(--body);background:#16304F;color:#fff;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
main{max-width:1180px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px 20px;box-shadow:var(--shadow)}
.pend{font-size:14px;color:var(--muted)}
h2.t{margin:0;font:800 24px var(--display)}
select,input[type=number],input[type=text]{font:500 16px var(--body);padding:11px 13px;border:1px solid var(--line);border-radius:12px;background:var(--bg);color:var(--ink);width:100%}
.btn{font:700 15px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:11px 18px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;gap:8px;justify-content:center}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}.btn.del{color:var(--verm)}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* sala */
.passo{display:flex;align-items:center;gap:10px;margin:0 0 12px}.passo b{width:28px;height:28px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font:800 14px var(--display);flex:none}
.passo h3{margin:0;font:800 19px var(--display)}
.tipos{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.tipo{position:relative;overflow:hidden;border:2px solid transparent;border-radius:20px;padding:18px 16px 16px;cursor:pointer;color:#fff;text-align:left;font:inherit;background:var(--c);box-shadow:0 8px 24px color-mix(in srgb,var(--c) 30%,transparent);transition:transform .15s,box-shadow .15s,opacity .15s;min-height:132px;display:flex;flex-direction:column;justify-content:flex-end;gap:2px}
.tipo::before{content:'';position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:rgba(255,255,255,.16)}
.tipo::after{content:'';position:absolute;right:20px;top:46px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.1)}
.tipo .ic{position:absolute;top:14px;left:14px;font-size:30px;line-height:1}
.tipo b{font:800 19px var(--display);position:relative}.tipo small{font-size:13px;opacity:.9;position:relative}
.tipo:hover{transform:translateY(-3px)}
.tipos.esc .tipo:not(.on){opacity:.45}.tipo.on{border-color:#fff;box-shadow:0 0 0 4px color-mix(in srgb,var(--c) 45%,transparent),0 10px 28px color-mix(in srgb,var(--c) 40%,transparent)}
.tipo.on::after{content:'✓';background:#fff;color:var(--c);display:grid;place-items:center;font:800 20px var(--body);width:34px;height:34px;right:14px;top:14px}
.escolha{display:grid;grid-template-columns:1fr 1.6fr;gap:14px}
.escolha label{display:flex;flex-direction:column;gap:6px;font:700 14px var(--body)}
.outro{display:flex;flex-direction:column;gap:6px;font:700 14px var(--body);margin-top:12px}.outro[hidden]{display:none}
.escolha .ajuda{font-weight:500;font-size:12.5px;color:var(--muted)}
.comecar{width:100%;font:800 19px var(--display);padding:16px;border-radius:16px;border:0;color:#16304F;background:var(--amarelo);cursor:pointer;margin-top:6px;box-shadow:0 10px 26px rgba(221,221,36,.25)}
.comecar:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.sala{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:16px;align-items:start}
.cron{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--shadow)}
.cronh{display:flex;align-items:center;justify-content:space-between;gap:10px;font:700 13px var(--body);text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.visor{position:relative;overflow:hidden;border-radius:18px;padding:26px 18px 30px;text-align:center;color:#fff;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 78%,#0B1020),#0E2238 85%);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08);transition:background .3s}
.visor::before{content:'';position:absolute;left:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.visor::after{content:'';position:absolute;right:-30px;bottom:-70px;width:180px;height:180px;border-radius:50%;border:16px solid rgba(255,255,255,.06)}
.visor b{position:relative;display:block;font:800 clamp(52px,10vw,82px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:.01em;text-shadow:0 4px 20px rgba(0,0,0,.25)}
.visor span{position:relative;display:inline-block;margin-top:10px;font:600 14px var(--body);color:rgba(255,255,255,.85);background:rgba(255,255,255,.12);padding:4px 12px;border-radius:999px}
.visor .vbar{position:absolute;left:18px;right:18px;bottom:12px;height:5px;border-radius:9px;background:rgba(255,255,255,.15);overflow:hidden}.visor .vbar em{display:block;height:100%;width:0;background:var(--amarelo);border-radius:9px;transition:width .5s}
.visor.pausa b{opacity:.55}
.sessao{text-align:center}.sessao b{display:block;font:800 21px var(--display)}.sessao span{color:var(--muted)}
.lbl{font:700 14px var(--body);margin-top:2px}
.ajuda{font-size:12.5px;color:var(--muted);margin-top:-6px}
.cron .tipos{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.cron .tipo{min-height:0;padding:14px 14px 13px 58px;border-radius:16px;justify-content:center}
.cron .tipo .ic{top:50%;transform:translateY(-50%);left:14px;font-size:28px}
.cron .tipo b{font-size:16.5px;line-height:1.15}.cron .tipo small{font-size:12px}
.cron .tipo.on::after{width:26px;height:26px;font-size:15px;right:10px;top:10px}
.cron .comecar{margin-top:4px}
@media (max-width:860px){.sala{grid-template-columns:1fr}}
@media (max-width:520px){.cron .tipo small{display:none}.cron .tipo{padding:16px 10px 16px 50px}.cron .tipo .ic{left:12px;font-size:24px}}
.hstat{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.hstat div{background:var(--soft);border-radius:12px;padding:10px 8px;text-align:center}.hstat b{display:block;font:800 20px var(--display)}.hstat span{font-size:12px;color:var(--muted,#8a94a6)}
.lado{display:flex;flex-direction:column;gap:16px;min-width:0}
#vivoBox .vh{display:flex;align-items:center;gap:10px;margin-bottom:4px}#vivoBox .vh h3{margin:0;font:800 18px var(--display)}
.vcount{display:inline-flex;align-items:center;gap:6px;font:800 14px var(--body);background:color-mix(in srgb,#1BAF7A 18%,transparent);color:#1BAF7A;padding:3px 10px;border-radius:999px}
.vcount i{width:8px;height:8px;border-radius:50%;background:#1BAF7A}
@keyframes vpulse{0%{box-shadow:0 0 0 0 rgba(27,175,122,.6)}70%{box-shadow:0 0 0 7px rgba(27,175,122,0)}100%{box-shadow:0 0 0 0 rgba(27,175,122,0)}}
#vivoBox .vh .btn.sm,.btn.sm{margin-left:auto;padding:6px 12px;font-size:13px}
.bdg{display:inline-grid;place-items:center;min-width:19px;height:19px;padding:0 5px;border-radius:999px;background:#E5484D;color:#fff;font:800 11px var(--body);font-style:normal;margin-left:4px}
.vsubt{margin:0 0 10px;color:var(--muted);font-size:13.5px;line-height:1.4}
.vsub{margin:12px 0 6px;font:700 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.viv{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:transparent;border:1px solid transparent;border-radius:14px;padding:8px 10px;color:var(--ink);font:inherit;cursor:pointer}
.viv:hover,.viv:focus-visible{background:var(--soft);border-color:var(--line);outline:none}
.viv .tx{flex:1;min-width:0;display:flex;flex-direction:column}.viv .tx b{font-weight:700;font-size:15px}.viv .tx small{color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.viv .mi{opacity:0;transition:opacity .15s}.viv:hover .mi{opacity:.8}
.viv .qd{display:flex;flex-direction:column;align-items:flex-end;gap:3px;color:var(--muted);font-size:12px;white-space:nowrap}
.av{position:relative;flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:var(--c);color:#fff;font:800 14px var(--display)}
.av i{position:absolute;right:-1px;bottom:-1px;width:12px;height:12px;border-radius:50%;border:2px solid var(--card)}.av i.on{background:#1BAF7A}.av i.idle{background:#C9A227}
.vopt{display:flex;align-items:center;gap:8px;margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:13.5px;color:var(--muted);cursor:pointer}
.dlg.chat .box{max-width:440px;display:flex;flex-direction:column}
.dlg.chat .top{position:relative;padding-right:52px}.dlg.chat .x{position:absolute;right:12px;top:12px;width:32px;height:32px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font:700 15px var(--body);cursor:pointer}
.cht{display:flex;align-items:center;gap:12px}.cht h3{font-size:19px!important}
.dlg.chat .lst{padding:10px;max-height:60vh;overflow:auto}
.msgs{display:flex;flex-direction:column;gap:6px;padding:14px;height:min(52vh,420px);overflow:auto;background:var(--bg)}
.bal{max-width:80%;align-self:flex-start;background:var(--card);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:8px 12px;display:flex;flex-direction:column;gap:2px}
.bal span{white-space:pre-wrap;word-wrap:break-word;font-size:15px;line-height:1.35}.bal small{font-size:11px;color:var(--muted);align-self:flex-end}
.bal.eu{align-self:flex-end;background:#3A8CCB;border-color:#3A8CCB;color:#fff;border-radius:16px 16px 4px 16px}.bal.eu small{color:rgba(255,255,255,.8)}
.cin{display:flex;gap:8px;padding:12px 14px 6px;border-top:1px solid var(--line)}.cin input{flex:1;min-width:0;font:inherit;font-size:15px;padding:10px 14px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
.cin .btn{border-radius:999px}
.dlg.chat .regra{margin:0;padding:2px 16px 4px;font-size:12px;color:var(--muted);text-align:center}.dlg.chat .msg{padding:0 16px 10px;text-align:center}
.chops{display:flex;gap:6px;margin-top:10px}.chops button{border:0;background:rgba(255,255,255,.14);color:#fff;font:600 12.5px var(--body);padding:5px 10px;border-radius:999px;cursor:pointer}.chops button:hover{background:rgba(255,255,255,.24)}
.blqbar{padding:10px 16px;background:color-mix(in srgb,#E5484D 14%,var(--card));font-size:13.5px}.blqbar button{border:0;background:none;color:#3A8CCB;font:700 13.5px var(--body);cursor:pointer;padding:0 0 0 4px}
.denf{display:flex;flex-direction:column;gap:8px;padding:14px 16px;border-bottom:1px solid var(--line);background:color-mix(in srgb,#E5484D 8%,var(--card))}.denf textarea{font:inherit;font-size:14px;padding:8px 10px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
.den summary{cursor:pointer;font-size:15px}.den.ok{opacity:.7}
/* cronômetro */
.relogio{display:flex;flex-direction:column;align-items:center;gap:16px;padding:26px 18px;border-radius:24px;background:radial-gradient(600px 300px at 50% 0%,color-mix(in srgb,var(--c) 22%,transparent),transparent 70%),var(--card);border:1px solid var(--line)}
.chip{display:inline-flex;align-items:center;gap:7px;background:var(--c);color:#fff;font:800 14px var(--body);padding:6px 14px;border-radius:999px}
.rmat{text-align:center}.rmat b{display:block;font:800 22px var(--display)}.rmat span{color:var(--muted)}
.dial{position:relative;width:min(330px,82vw);aspect-ratio:1}
.dial svg{width:100%;height:100%}
.dial .tm{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.dial .tm b{font:800 clamp(44px,12vw,64px)/1 var(--display);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.dial .tm span{margin-top:6px;color:var(--muted);font-size:14px}
.dial.pausa .tm b{opacity:.55}
.rbtns{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.rbtns .btn{min-width:150px;font-size:16px;padding:13px 20px;border-radius:14px}
.rbtns .fim{background:var(--verm);border-color:var(--verm);color:#fff}
.pulse{animation:pulse 2s infinite}@keyframes pulse{50%{opacity:.6}}
.hoje{display:flex;flex-direction:column;gap:8px}
.ses{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-left:6px solid var(--c);border-radius:12px;padding:10px 12px;background:var(--bg)}
.ses .tx{flex:1;min-width:0}.ses .tx b{display:block}.ses .tx span{color:var(--muted);font-size:13px}
.ses .du{font:800 17px var(--display);font-variant-numeric:tabular-nums;white-space:nowrap}
.ses .del{border:0;background:none;color:var(--muted);cursor:pointer;font-size:18px}
/* diálogo */
.dlg{position:fixed;inset:0;z-index:60;background:rgba(5,8,18,.6);display:flex;align-items:flex-start;justify-content:center;padding:30px 14px;overflow:auto}
.dlg .box{background:var(--card);border:1px solid var(--line);border-radius:20px;max-width:460px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.dlg .top{padding:18px 20px;background:var(--c);color:#fff}.dlg .top h3{margin:0;font:800 21px var(--display)}.dlg .top p{margin:2px 0 0;opacity:.92}
.dlg .bd{padding:18px 20px;display:flex;flex-direction:column;gap:14px}
.qs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.qs label{display:flex;flex-direction:column;gap:5px;font:700 13px var(--body);text-align:center}
.qs input{text-align:center;font:800 24px var(--display);padding:10px 6px}
.qs .ac input{border-color:var(--verde)}.qs .er input{border-color:var(--verm)}
.dlg .msg{color:var(--verm);font-size:14px;min-height:18px;margin:0}
.dlg .chk{display:flex;gap:8px;align-items:center;font-size:14px}
/* dashboard (mesma linguagem da Análise de Incidência) */
.dtop{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dtop h2{margin:0;font:800 24px var(--display)}.dtop select{width:auto;min-width:260px;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.kpi{border-radius:18px;padding:16px 18px;display:grid;grid-template-columns:60px 1fr;gap:14px;align-items:center;background:var(--card);border:1px solid var(--line);box-shadow:var(--shadow);min-width:0}
.kpi>div{min-width:0;display:flex;flex-direction:column}
.kpi span{font:600 12px var(--body);text-transform:uppercase;letter-spacing:.6px;color:var(--muted)}
.kpi b{font:800 27px/1.15 var(--display);font-variant-numeric:tabular-nums}.kpi b small{font-size:15px;color:var(--muted)}
.kpi small{font-size:13px;color:var(--muted)}
.k-a{background:linear-gradient(135deg,#3A8CCB,#16304F);border:0;color:#fff}.k-a span,.k-a small,.k-a b small{color:#D6E6F5}
.ico{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-size:24px;background:var(--soft)}.k-a .ico{background:rgba(255,255,255,.16)}
.ring{width:60px;height:60px}.ring .rv{font:800 14px var(--display);fill:var(--ink)}
.chart{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow)}
.chart h3{font:700 19px var(--display);margin:0 0 4px;display:flex;align-items:center;gap:10px}.chart h3 .hi{width:12px;height:26px;border-radius:6px;flex:none}
.hi.a{background:linear-gradient(#3A8CCB,#DDDD24)}.hi.b{background:linear-gradient(#EB6834,#7B61FF)}.hi.c{background:linear-gradient(#1BAF7A,#3A8CCB)}
.chart .sub{margin:0 0 12px;color:var(--muted);font-size:13.5px}
.duo{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}
.heat{overflow-x:auto;padding-bottom:6px}
.heat .grid{display:grid;grid-auto-flow:column;grid-template-rows:16px repeat(7,15px);gap:4px;width:max-content}
.heat .dl{font-size:11px;color:var(--muted);line-height:15px;padding-right:4px}
.heat .ml{font-size:11px;color:var(--muted);white-space:nowrap;line-height:16px}
.heat .c{width:15px;height:15px;border-radius:4px;background:var(--soft)}
.hleg .c{background:var(--soft)}.hleg .c.l1,.heat .c.l1{background:color-mix(in srgb,var(--verde) 30%,var(--soft))}.hleg .c.l2,.heat .c.l2{background:color-mix(in srgb,var(--verde) 55%,var(--soft))}.hleg .c.l3,.heat .c.l3{background:color-mix(in srgb,var(--verde) 80%,var(--soft))}.hleg .c.l4{background:var(--verde)}.heat .c.l4{background:var(--verde)}
.heat .c.hj{outline:2px solid var(--amarelo);outline-offset:1px}.heat .c.fut{opacity:.35}.heat .c.prova{background:var(--amarelo)}
.hleg{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);margin-top:8px}.hleg .c{width:12px;height:12px;border-radius:3px}
.wbars{display:flex;align-items:flex-end;gap:8px;height:170px;padding-top:10px}
.wb{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0;height:100%;justify-content:flex-end}

const SB=supabase.createClient('https://ygdlbhoqyqjsqoyyfizk.supabase.co','sb_publishable_jB2I59Ruw4MaMT63KLWtSA_O-DMf63b');

  else if(location.hash==='#painel'&&$('tabPainel').hidden===false)telaPainel(ALVO);

function menus(){const adm=REAL_ADMIN&&!EXMODO,stf=STAFF&&!EXMODO;$('tabPainel').hidden=!(ASSESSORIA&&!stf);$('tabPainel').textContent='Meu Dashboard';$('tabAlunos').hidden=!stf;$('tabDen').hidden=!adm;$('tabEx').hidden=!adm;$('exBar').hidden=!EXMODO||MVER;}

async function carregaPlano(){if(PLANO)return;const [p,c]=await Promise.all([MENTORADO?SB.from('m_plano').select('id,semana,materia,frente,assunto').eq('email',ALVO).order('semana').order('id'):SB.from('plano_itens').select('id,semana,materia,frente,assunto').order('id'),SB.from('checkup').select('respostas').eq('email',ALVO).maybeSingle()]);
  PLANO=p.data||[];LINGUA=(c.data&&c.data.respostas&&c.data.respostas.lingua)||'';}
const semanas=()=>[...new Set(PLANO.map(x=>x.semana))].sort();
const semAtual=()=>{const s=semanas(),h=iso(new Date());let i=s.findIndex((x,k)=>h>=x&&(k===s.length-1||h<s[k+1]));return i<0?(h<s[0]?0:s.length-1):i;};
const lerS=()=>{try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return s&&s.email===ALVO?s:null;}catch(e){return null;}};
const gravaS=s=>{try{s?localStorage.setItem(KEY,JSON.stringify(s)):localStorage.removeItem(KEY);}catch(e){}if(window.pingPresenca)setTimeout(pingPresenca,300);};
const decorrido=s=>(s.acum||0)+(s.rodando?Date.now()-s.desde:0);
let TICK=null;

/* ---------- Sala de Estudos ---------- */
async function telaSala(){abas('tabSala');clearInterval(TICK);$('app').innerHTML='<p class="pend">Carregando a sala de estudos…</p>';
  try{await carregaPlano();}catch(e){}
  desenhaSala(lerS());}
function desenhaSala(s){abas('tabSala');clearInterval(TICK);
  const esc_={tipos:[],materia:'',item:''};
  const lst=semanas(),ca=semAtual();
  const minhas=MATS.filter(m=>!(m==='Inglês'&&LINGUA==='Espanhol')&&!(m==='Espanhol'&&LINGUA==='Inglês')&&!(m==='Francês'&&LINGUA!=='Francês'));
  const cor=s?TI(s.tipo)[3]:'#3A8CCB';
  $('app').innerHTML=`<div class="sala"><section class="cron" id="cron" style="--c:${cor}">
     <div class="cronh"><span>⏱ Cronômetro</span>${s?`<span class="chip">${TI(s.tipo)[1]} ${esc(TI(s.tipo)[0])}</span>`:''}</div>
     <div class="visor${s?' ativo':''}" id="visor"><b id="tempo">00:00:00</b><span id="estado">Pronto para começar</span><i class="vbar"><em id="vbar"></em></i></div>
     ${s?`<div class="sessao"><b>${esc(s.materia)}</b><span>${esc(s.assunto||'')}</span></div>
       <div class="rbtns"><button class="btn" id="pp"></button><button class="btn fim" id="fim">■ Encerrar</button></div>
       <p class="pend" style="margin:0;text-align:center">Pode fechar ou trocar de página: o cronômetro continua contando.</p>`
     :`<div class="lbl">O que você vai fazer? <span style="font-weight:500;color:var(--muted)">(pode marcar mais de um)</span></div>
       <div class="tipos" id="tipos">${Object.entries(TIPOS).map(([k,[n,ic,d,c]])=>`<button class="tipo" data-t="${k}" style="--c:${c}"><span class="ic">${ic}</span><b>${n}</b><small>${d}</small></button>`).join('')}</div>
       <label class="lbl" for="sMat">Matéria</label><select id="sMat"><option value="">Selecione a matéria</option>${minhas.map(m=>`<option>${esc(m)}</option>`).join('')}</select>
       <label class="lbl" for="sAss">Assunto</label><select id="sAss" disabled><option value="">Escolha antes a matéria</option></select>
       <span class="ajuda">Aparecem todos os assuntos do Plano de Estudos, de todas as semanas: pode adiantar conteúdo.</span>
       <label id="lOutro" class="outro" hidden>Qual assunto?<input type="text" id="sOutro" placeholder="ex.: lista de exercícios de funções" maxlength="140"></label>
       <button class="comecar" id="go" disabled>▶ Iniciar</button>`}
   </section>
   <div class="lado"><aside class="card" id="hojeBox"><h3 style="margin:0 0 10px;font:800 18px var(--display)">Hoje</h3><p class="pend" style="margin:0">Carregando…</p></aside>
   <aside class="card" id="vivoBox"><div class="vh"><h3>Estudando agora</h3></div><p class="pend" style="margin:0">Carregando…</p></aside></div></div>`;
  if(s){
    const atual=()=>{const t=decorrido(s)/1000;$('tempo').textContent=hms(t);$('vbar').style.width=(100*(t%3600)/3600).toFixed(1)+'%';
      $('estado').textContent=s.rodando?'Estudando…':'Pausado';$('estado').className=s.rodando?'pulse':'';$('visor').classList.toggle('pausa',!s.rodando);
      $('pp').textContent=s.rodando?'❚❚ Pausar':'▶ Continuar';};
    TICK=setInterval(atual,500);atual();
    $('pp').onclick=()=>{if(s.rodando){s.acum=decorrido(s);s.rodando=false;}else{s.desde=Date.now();s.rodando=true;}gravaS(s);atual();};
    $('fim').onclick=()=>encerrar(s);
  }else{
    const pronto=()=>{$('go').disabled=!(esc_.tipos.length&&esc_.materia&&esc_.item&&(esc_.item!=='__outro'||$('sOutro').value.trim()));
      $('estado').textContent=$('go').disabled?'Pronto para começar':'Tudo certo: aperte Iniciar';};
    $('tipos').querySelectorAll('.tipo').forEach(b=>b.onclick=()=>{b.classList.toggle('on');esc_.tipos=[...$('tipos').querySelectorAll('.tipo.on')].map(x=>x.dataset.t);$('tipos').classList.toggle('esc',esc_.tipos.length>0);$('cron').style.setProperty('--c',esc_.tipos.length?TIPOS[esc_.tipos[0]][3]:'#3A8CCB');pronto();});
    $('sMat').onchange=()=>{esc_.materia=$('sMat').value;esc_.item='';const L=PLANO.filter(x=>x.materia===esc_.materia);
      let h='<option value="">Selecione o assunto</option>';
      lst.forEach((w,i)=>{const G=L.filter(x=>x.semana===w);if(!G.length)return;h+=`<optgroup label="Semana ${i+1} · ${dm(pData(w))}${i===ca?' (esta semana)':''}">${G.map(x=>`<option value="${x.id}">${esc(x.assunto)}${x.frente?' — '+esc(x.frente):''}</option>`).join('')}</optgroup>`;});
      h+='<option value="__outro">Outro assunto (digitar)</option>';
      $('sAss').innerHTML=h;$('sAss').disabled=!esc_.materia;
      const atualW=L.find(x=>x.semana===lst[ca]);if(atualW){$('sAss').value=String(atualW.id);esc_.item=String(atualW.id);}else if(esc_.materia&&!L.length){$('sAss').value='__outro';esc_.item='__outro';}

    $('sOutro').oninput=pronto;
    $('go').onclick=()=>{const it=esc_.item!=='__outro'?PLANO.find(x=>String(x.id)===esc_.item):null;
      const n={email:ALVO,tipo:esc_.tipos.join(','),materia:esc_.materia,assunto:it?it.assunto:$('sOutro').value.trim(),item:it?it.id:null,inicio:Date.now(),desde:Date.now(),acum:0,rodando:true};
      gravaS(n);desenhaSala(n);};}
  desenhaHoje();desenhaVivo();}
function desenhaRelogio(s){desenhaSala(s);}
function encerrar(s){const seg=Math.round(decorrido(s)/1000);if(s.rodando){s.acum=decorrido(s);s.rodando=false;gravaS(s);}
  const [n,ic,,c]=TI(s.tipo);const pedeQ=tlist(s.tipo).some(k=>k==='questoes'||k==='correcao');
  const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="box" style="--c:${c}"><div class="top"><h3>${ic} Sessão encerrada: ${hfmt(seg)}</h3><p>${esc(s.materia)} · ${esc(s.assunto||'')}</p></div>
   <form class="bd"><div><b style="font-size:15px">Questões ${pedeQ?'':'(se você fez alguma)'}</b><p class="pend" style="margin:2px 0 8px">Quantas você fez, acertou e errou nesta sessão?</p>
    <div class="qs"><label>Feitas<input type="number" name="q" min="0" max="999" inputmode="numeric" value="${pedeQ?'':0}"></label><label class="ac">Acertos<input type="number" name="a" min="0" max="999" inputmode="numeric" value="${pedeQ?'':0}"></label><label class="er">Erros<input type="number" name="e" min="0" max="999" inputmode="numeric" value="${pedeQ?'':0}"></label></div></div>
    ${s.item&&ASSESSORIA_ALVO()?`<label class="chk"><input type="checkbox" name="mk" checked> Marcar “${esc(s.assunto)}” como estudado no Plano de Estudos</label>`:''}
    <p class="msg"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" type="submit" style="flex:1">Salvar sessão</button><button class="btn" type="button" data-x="volta">Voltar a estudar</button></div>
    <button class="btn del" type="button" data-x="desc" style="background:none;border:0">Descartar esta sessão</button></form></div>`;
  document.body.appendChild(d);const f=d.querySelector('form'),msg=t=>d.querySelector('.msg').textContent=t;
  const num=x=>{const v=parseInt(f[x].value,10);return isNaN(v)?0:v;};
  f.a.oninput=()=>{if(f.q.value!=='')f.e.value=Math.max(0,num('q')-num('a'));};f.q.oninput=f.a.oninput;
  d.querySelector('[data-x=volta]').onclick=()=>{d.remove();s.desde=Date.now();s.rodando=true;gravaS(s);desenhaRelogio(s);};
  d.querySelector('[data-x=desc]').onclick=()=>{if(!confirm('Descartar esta sessão? O tempo não será salvo.'))return;gravaS(null);d.remove();telaSala();};
  f.onsubmit=async ev=>{ev.preventDefault();const q=num('q'),a=num('a'),e=num('e');
    if(a+e>q){msg('Acertos + erros não pode passar do total de questões feitas.');return;}
    const bt=f.querySelector('[type=submit]');bt.disabled=true;
    const fimT=Date.now();const row={email:s.email,inicio:new Date(s.inicio).toISOString(),fim:new Date(fimT).toISOString(),segundos:seg,tipo:s.tipo,materia:s.materia,assunto:s.assunto||null,plano_item:s.item,questoes:q,acertos:a,erros:e};
    const r=await SB.from('sessoes').insert(row);if(r.error){msg('Não foi possível salvar: '+r.error.message);bt.disabled=false;return;}
    if(f.mk&&f.mk.checked)await SB.from(MENTORADO?'m_plano_feito':'plano_feito').insert({email:s.email,item:s.item});
    gravaS(null);d.remove();telaSala();};}
function ASSESSORIA_ALVO(){return EXMODO||ASSESSORIA;}
async function desenhaHoje(){const ini=new Date();ini.setHours(0,0,0,0);
  const {data}=await SB.from('sessoes').select('*').eq('email',ALVO).gte('inicio',ini.toISOString()).order('inicio',{ascending:false});
  const box=$('hojeBox');if(!box)return;const L=data||[];const tot=L.reduce((t,x)=>t+x.segundos,0),q=L.reduce((t,x)=>t+x.questoes,0),a=L.reduce((t,x)=>t+x.acertos,0);
  box.innerHTML=`<div style="display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px"><h3 style="margin:0;font:800 18px var(--display)">Hoje</h3></div>

      <textarea name="m" rows="3" maxlength="1000" placeholder="O que aconteceu? (opcional)"></textarea>
      <label class="chk"><input type="checkbox" name="b" checked> Bloquear esta pessoa também</label>
      <div style="display:flex;gap:8px"><button class="btn pri" type="submit" style="flex:1;background:#E5484D;border-color:#E5484D">Enviar denúncia</button><button class="btn" type="button" data-a="can">Cancelar</button></div>`;
    d.querySelector('.msgs').before(w);w.querySelector('[data-a=can]').onclick=()=>w.remove();
    w.onsubmit=async e=>{e.preventDefault();const {error}=await SB.rpc('denunciar',{p_com:uid,p_motivo:w.m.value,p_bloquear:w.b.checked});
      if(error){$('chErr').textContent='Não deu para enviar a denúncia. Tente de novo.';return;}
      const bl=w.b.checked;w.innerHTML='<b style="color:#1BAF7A">✓ Denúncia enviada ao Prof. Jazz.</b>'+(bl?'<p class="pend" style="margin:0">Esta pessoa foi bloqueada.</p>':'');if(bl)estBlq(true);setTimeout(()=>w.remove(),4000);};};setTimeout(()=>f.t.focus(),50);
  f.onsubmit=async e=>{e.preventDefault();const t=f.t.value.trim();if(!t)return;f.t.value='';$('chErr').textContent='';
    const {error}=await SB.rpc('enviar_msg',{p_para:uid,p_texto:t});if(error){$('chErr').textContent=/muitas/.test(error.message)?'Muitas mensagens seguidas: espere um pouco.':/indisponivel/.test(error.message)?'Esta pessoa não está recebendo mensagens.':'Não deu para enviar. Tente de novo.';f.t.value=t;return;}ult='';carrega();};}

async function telaDen(){abas('tabDen');$('app').innerHTML='<p class="pend">Carregando…</p>';
  const {data,error}=await SB.rpc('admin_denuncias');if(error){$('app').innerHTML=`<div class="card"><p class="pend">${esc(error.message)}</p></div>`;return;}
  const L=data||[];const ab=L.filter(x=>!x.resolvida).length;
  $('app').innerHTML=`<div class="card" style="margin-bottom:14px"><h2 style="margin:0;font:800 22px var(--display)">Denúncias</h2><p class="pend" style="margin:4px 0 0">As conversas entre os alunos são privadas. Aqui aparecem só as que algum aluno denunciou, com as mensagens daquela conversa. ${ab?`<b style="color:#E5484D">${ab} em aberto.</b>`:'Nenhuma em aberto.'}</p></div>
   ${L.map(x=>`<details class="card den${x.resolvida?' ok':''}" style="margin-bottom:10px"><summary><b>${esc(x.de_nome)}</b> denunciou <b>${esc(x.contra_nome)}</b> <span class="pend">· ${quandoMsg(x.criada)} · ${x.resolvida?'resolvida':'<span style="color:#E5484D;font-weight:700">em aberto</span>'}</span></summary>
     <p class="pend" style="margin:8px 0">${esc(x.de)} → ${esc(x.contra)}</p>${x.motivo?`<p><b>Motivo:</b> ${esc(x.motivo)}</p>`:''}
     <div class="msgs" style="height:auto;max-height:360px;border-radius:12px">${(x.conversa||[]).map(m=>`<div class="bal${m.autor===x.de_nome?' eu':''}"><small style="align-self:flex-start;font-weight:700">${esc(m.autor)}</small><span>${esc(m.texto)}</span><small>${quandoMsg(m.criada)}</small></div>`).join('')||'<p class="pend">Sem mensagens.</p>'}</div>
     <button class="btn" data-id="${x.id}" data-r="${x.resolvida?0:1}" style="margin-top:10px">${x.resolvida?'Reabrir':'Marcar como resolvida'}</button></details>`).join('')}`;
  $('app').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await SB.rpc('admin_resolver',{p_id:+b.dataset.id,p:b.dataset.r==='1'});telaDen();});}
entrar();
</script>
