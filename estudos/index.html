const lerS=()=>{try{const s=JSON.parse(localStorage.getItem(KEY)||'null');return s&&s.email===ALVO?s:null;}catch(e){return null;}};

async function preSelPlanejado(){const id=new URLSearchParams(location.search).get('planejado');if(!id)return;

function encerrar(s){const seg=Math.round(decorrido(s)/1000);if(s.rodando){s.acum=decorrido(s);s.rodando=false;gravaS(s);}
  const [n,ic,,c]=TI(s.tipo);const simu=tlist(s.tipo).includes('correcao');const pedeQ=tlist(s.tipo).some(k=>k==='questoes'||k==='correcao');
  const discs=MATS.filter(m=>!(m==='Inglês'&&LINGUA==='Espanhol')&&!(m==='Espanhol'&&LINGUA==='Inglês')&&!(m==='Francês'&&LINGUA!=='Francês')&&m!=='Redação');
  const blocoSim=simu?`<div><b style="font-size:15px">Questões por disciplina</b><p class="pend" style="margin:2px 0 8px">Toque em cada disciplina que você corrigiu e informe quantas fez e quantas acertou.</p>

    <div class="drows" id="drows"></div><div class="dtot" id="dtot"></div></div>
    <div id="errBox"><b style="font-size:15px">Tipos de erro</b><p class="pend" style="margin:2px 0 8px">Dos seus erros, quantos foram de cada tipo?</p>
    <div class="terr">${TERR.map(([k,nm,dd,cc])=>`<label style="--c:${cc}"><span><b>${nm}</b><small>${dd}</small></span><input type="number" name="te_${k}" min="0" max="999" inputmode="numeric" value="0"></label>`).join('')}</div>
    <div class="dtot" id="etot"></div></div>`:'';
  const d=document.createElement('div');d.className='dlg';d.innerHTML=`<div class="box" style="--c:${c}"><div class="top"><h3>${ic} Sessão encerrada: ${hfmt(seg)}</h3><p>${esc(s.materia)}${s.assunto?' · '+esc(s.assunto):''}</p></div>
   <form class="bd">${blocoSim}${s.livre&&!simu?`<div><b style="font-size:15px">O que você revisou?</b><p class="pend" style="margin:2px 0 8px">Marque o que usou (pode ser mais de um) e, se quiser, conte em poucas palavras.</p>
    <div class="revm">${['Anki / flashcards','Caderno de erros','Resumos','Mapas mentais','Questões já feitas','Outro'].map(m=>`<label><input type="checkbox" name="rv" value="${m}"> ${m}</label>`).join('')}</div>
    <input type="text" name="rvt" maxlength="120" placeholder="ex.: Anki de Biologia e Química" style="margin-top:8px;width:100%"></div>`:''}<div${simu?' hidden':''}><b style="font-size:15px">Questões ${pedeQ?'':'(se você fez alguma)'}</b><p class="pend" style="margin:2px 0 8px">Quantas você fez, acertou e errou nesta sessão?</p>
    <div class="qs"${simu?' hidden':''}><label>Feitas<input type="number" name="q" min="0" max="999" inputmode="numeric" value="${pedeQ?'':0}"></label><label class="ac">Acertos<input type="number" name="a" min="0" max="999" inputmode="numeric" value="${pedeQ?'':0}"></label><label class="er">Erros<input type="number" name="e" min="0" max="999" inputmode="numeric" value="${pedeQ?'':0}"></label></div></div>
    ${s.item&&ASSESSORIA_ALVO()?`<label class="chk"><input type="checkbox" name="mk" checked> Marcar “${esc(s.assunto)}” como estudado no Plano de Estudos</label>`:''}
    <p class="msg"></p>
    <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn pri" type="submit" style="flex:1">Salvar sessão</button><button class="btn" type="button" data-x="volta">Voltar a estudar</button></div>
    <button class="btn del" type="button" data-x="desc" style="background:none;border:0">Descartar esta sessão</button></form></div>`;
  document.body.appendChild(d);const f=d.querySelector('form'),msg=t=>d.querySelector('.msg').textContent=t;
  const num=x=>{const v=parseInt(f[x].value,10);return isNaN(v)?0:v;};
  f.a.oninput=()=>{if(f.q.value!=='')f.e.value=Math.max(0,num('q')-num('a'));};f.q.oninput=f.a.oninput;
  const DS={};const totSim=()=>{let q=0,a=0;Object.values(DS).forEach(x=>{q+=x.q;a+=x.a;});return {q,a,e:Math.max(0,q-a)};};
  const somaErr=()=>TERR.reduce((t,[k])=>t+(parseInt(f['te_'+k].value,10)||0),0);
  const atualSim=()=>{if(!simu)return;msg('');const t=totSim();$('dtot').innerHTML=Object.keys(DS).length?`Total: <b>${t.q}</b> questões · <b style="color:#1BAF7A">${t.a}</b> acertos · <b style="color:#E5484D">${t.e}</b> erros`:'';
    const se=somaErr(),fl=t.e-se;$('errBox').hidden=!t.e;$('etot').innerHTML=!t.e?'':fl===0?'<span style="color:#1BAF7A">Todos os erros classificados ✓</span>':fl>0?`Faltam classificar <b>${fl}</b> erro${fl>1?'s':''}`:`<span style="color:#E5484D">Você classificou <b>${-fl}</b> a mais do que o total de erros</span>`;};
  const linhaD=m=>{const id='d'+discs.indexOf(m);const r=document.createElement('div');r.className='drow';r.dataset.m=m;
    r.innerHTML=`<span class="dn"><i style="background:${CORM[m]||'#3A8CCB'}"></i>${esc(m)}</span><label>Feitas<input type="number" min="0" max="999" inputmode="numeric" class="dq"></label><label class="ac">Acertos<input type="number" min="0" max="999" inputmode="numeric" class="da"></label><label class="er">Erros<input type="number" class="de" readonly tabindex="-1"></label>`;
    const up=()=>{const q=parseInt(r.querySelector('.dq').value,10)||0,a=Math.min(q,parseInt(r.querySelector('.da').value,10)||0);DS[m]={q,a,e:q-a};r.querySelector('.de').value=r.querySelector('.dq').value===''?'':q-a;atualSim();};
    r.querySelector('.dq').oninput=up;r.querySelector('.da').oninput=up;DS[m]={q:0,a:0,e:0};$('drows').appendChild(r);r.querySelector('.dq').focus();atualSim();};
  if(simu){d.querySelectorAll('.dchip').forEach(b=>b.onclick=()=>{const m=b.dataset.m;b.classList.toggle('on');

      const se=somaErr();if(t.e&&se!==t.e){msg(se<t.e?`Classifique todos os erros: faltam ${t.e-se}.`:`A soma dos tipos de erro (${se}) passou do total de erros (${t.e}).`);return;}
      q=t.q;a=t.a;e=t.e;const disc={};Object.entries(DS).forEach(([m,x])=>{if(x.q)disc[m]=x;});
      det={disc,erros:Object.fromEntries(TERR.map(([k])=>[k,parseInt(f['te_'+k].value,10)||0]))};
      if(s.livre){const ks=Object.keys(disc);s.assunto=(ks.length>3?ks.slice(0,3).join(', ')+' e mais '+(ks.length-3):ks.join(', ')).slice(0,200);}}

    const fimT=Date.now();const row={email:s.email,inicio:new Date(s.inicio).toISOString(),fim:new Date(fimT).toISOString(),segundos:seg,tipo:s.tipo,materia:s.materia,assunto:s.assunto||null,plano_item:s.item,questoes:q,acertos:a,erros:e,detalhe:det};

async function cardCaderno(email,cab){const {data}=await SB.from('caderno_erros').select('materia,assunto,revisada').eq('email',email);const T=data||[];
  const G={};T.forEach(x=>{const k=x.materia+'|'+(x.assunto||'');const g=G[k]=G[k]||{m:x.materia,a:x.assunto,n:0,r:0};g.n++;if(!x.revisada)g.r++;});
  const L=Object.values(G).sort((a,b)=>b.r-a.r||b.n-a.n).slice(0,7);const mx=Math.max(1,...L.map(x=>x.n));
  return `<div class="chart"><h3 style="display:flex;align-items:center;gap:10px;flex-wrap:wrap"><i class="hi a"></i>Assuntos que mais erro<span style="margin-left:auto"><button class="btn avbtn" id="dCad">Abrir o Caderno de Erros</button></span></h3>
   <p class="sub">${T.length?`Do Caderno de Erros: ${T.length} quest${T.length>1?'ões':'ão'} anotada${T.length>1?'s':''}, ${T.filter(x=>!x.revisada).length} ainda a revisar. A barra clara mostra o que já foi revisado.`:'Aparece quando houver questões anotadas no Caderno de Erros (o site pergunta ao encerrar uma sessão com erros).'}</p>
   ${L.length?`<div class="cdtop">${L.map(x=>{const c=CORM[x.m]||'#3A8CCB';return `<div class="lin"><span title="${esc(x.m)} · ${esc(x.a||'só pela foto')}"><b style="color:${c}">${esc(x.m)}</b> · ${esc(x.a||'só pela foto')}</span><span style="background:var(--soft);border-radius:9px"><i style="width:${Math.round(100*x.n/mx)}%;background:linear-gradient(90deg,${c} ${Math.round(100*x.r/x.n)}%,color-mix(in srgb,${c} 35%,transparent) ${Math.round(100*x.r/x.n)}%)"></i></span><b>${x.r}/${x.n}</b></div>`;}).join('')}</div>`:''}</div>`;}

   <div class="chart"><h3><i class="hi c"></i>Dias de estudo</h3><p class="sub">Cada quadradinho é um dia, de segunda a domingo. Quanto mais verde, mais tempo de estudo. O amarelo é o dia da prova.</p>

  if($('dCad'))$('dCad').onclick=()=>{CADV={f:'rev',m:null,a:null};if(cab)telaCaderno(email,cab);else{history.replaceState(null,'','#caderno');telaCaderno(email);}};
  if($('dAv'))$('dAv').onclick=async()=>{try{await carregaPlano();}catch(e){}formSessao(null,recar);};
  $('app').querySelectorAll('.edt').forEach(b=>b.onclick=async()=>{try{await carregaPlano();}catch(e){}formSessao(S.find(x=>String(x.id)===b.dataset.id),recar);});
  if($('dTodas'))$('dTodas').onclick=()=>{const d=document.createElement('div');d.className='dlg';
    d.innerHTML=`<div class="box" style="max-width:640px"><div class="top"><h3>Todas as sessões</h3><p>Toque em ✎ para corrigir uma sessão.</p></div><div class="bd"><div class="hoje" style="max-height:60vh;overflow:auto">${S.slice().reverse().map(x=>{const [n,ic,,c]=TI(x.tipo);const h=new Date(x.inicio);return `<div class="ses" style="--c:${c}"><span style="font-size:20px">${ic}</span><div class="tx"><b>${esc(x.materia)} · ${x.detalhe&&(x.detalhe.extra||x.detalhe.avulsa)?'Estudos Extras':esc(n)}</b><span>${dm(h)} às ${String(h.getHours()).padStart(2,'0')}:${String(h.getMinutes()).padStart(2,'0')} · ${esc(x.assunto||'')}${x.questoes?` · ${x.acertos}/${x.questoes} acertos`:''}</span></div><span class="du">${hfmt(x.segundos)}</span><button class="edt" data-id="${x.id}" title="Corrigir sessão">✎</button></div>`;}).join('')}</div><button class="btn" type="button" data-x="f">Fechar</button></div></div>`;
    document.body.appendChild(d);d.querySelector('[data-x=f]').onclick=()=>d.remove();d.addEventListener('mousedown',e=>{if(e.target===d)d.remove();});
    d.querySelectorAll('.edt').forEach(b=>b.onclick=async()=>{try{await carregaPlano();}catch(e){}d.remove();formSessao(S.find(x=>String(x.id)===b.dataset.id),recar);});};
  ligaCab();if($('irSala'))$('irSala').onclick=telaSala;}
let LALUNOS=null;
function ligaCab(){const s=$('selAl');if(!s)return;s.onchange=()=>telaAlunos(s.value);$('alAnt').onclick=()=>{if(s.selectedIndex>0){s.selectedIndex--;s.onchange();}};$('alProx').onclick=()=>{if(s.selectedIndex<s.options.length-1){s.selectedIndex++;s.onchange();}};}
async function telaAlunos(email){abas('tabAlunos');
  if(!LALUNOS){const {data}=await SB.rpc('admin_lista');LALUNOS=(data||[]).filter(a=>a.email!==ADMIN&&a.email!==EXEMPLO).sort((a,b)=>(b.assessoria-a.assessoria)||(a.nome||a.email).localeCompare(b.nome||b.email,'pt-BR',{sensitivity:'base'}));
    if(REAL_ADMIN){const m=await SB.rpc('m_lista');(m.data||[]).filter(x=>x.email!=='exemplo.mentoria@preparaufu.com.br').forEach(x=>{const t=LALUNOS.find(y=>y.email===x.email);if(t)t.mentoria=true;else LALUNOS.push({email:x.email,nome:x.nome,assessoria:true,mentoria:true,so_mentoria:true});});}}
  if(!LALUNOS.length){$('app').innerHTML='<div class="card"><p class="pend">Nenhum aluno cadastrado.</p></div>';return;}
  const al=email&&LALUNOS.find(a=>a.email===email)?email:LALUNOS[0].email;
  const cab=`<div class="card dtop"><h2>Dashboard do aluno</h2><select id="selAl">${LALUNOS.map(a=>`<option value="${esc(a.email)}"${a.email===al?' selected':''}>${esc(a.nome||a.email)}${a.so_mentoria?' (Mentoria individual)':a.assessoria?'':' (Curso de Matemática)'}</option>`).join('')}</select><button class="btn" id="alAnt">‹</button><button class="btn" id="alProx">›</button></div>`;
  history.replaceState(null,'','?aluno='+encodeURIComponent(al)+'#alunos');
  telaPainel(al,cab);}

/* ===== Estudando agora + mensagens ===== */
const iniN=n=>String(n||'?').trim().split(/\s+/).map(w=>w[0]||'').slice(0,2).join('').toUpperCase();
const quandoMsg=t=>{const d=new Date(t),h=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');return iso(d)===iso(new Date())?h:dm(d)+' '+h;};
let CHAT=null;
setInterval(()=>{if(!document.hidden&&$('vivoBox')&&!CHAT)desenhaVivo();},30000);
async function desenhaVivo(){const box=$('vivoBox');if(!box)return;
  const [a,b,c]=await Promise.all([SB.rpc('quem_online'),SB.rpc('nao_lidas'),SB.rpc('meu_estado')]);
  if(!$('vivoBox'))return;
  if(a.error){box.innerHTML='<div class="vh"><h3>Estudando agora</h3></div><p class="pend">Não deu para carregar agora.</p>';return;}
  const L=a.data||[],nl=b.data||0,oc=!!(c.data&&c.data[0]&&c.data[0].oculto);
  const outros=L.filter(x=>!x.eu),est=outros.filter(x=>x.estudando),on=outros.filter(x=>!x.estudando);
  const euEst=L.some(x=>x.eu&&x.estudando);
  const pessoa=x=>{const t=x.tipo?TI(x.tipo):null;const min=x.desde?Math.max(1,Math.round((Date.now()-new Date(x.desde))/60000)):0;
    return `<button class="viv" data-u="${x.uid}" data-n="${esc(x.nome)}" title="Mandar mensagem para ${esc(x.nome)}"><span class="av" style="--c:${x.estudando&&t?t[3]:'#6B7393'}">${esc(iniN(x.nome))}<i class="${x.estudando?'on':'idle'}"></i></span><span class="tx"><b>${esc(x.nome)}</b><small>${x.estudando?`${esc(x.materia||'')}${t?' · '+esc(t[0]):''} · há ${min<60?min+' min':hfmt(min*60)}`:'online no site'}</small></span><span class="mi">💬</span></button>`;};
  box.innerHTML=`<div class="vh"><h3>Estudando agora</h3><span class="vcount" title="estudando agora"><i></i>${est.length+(euEst?1:0)}</span><button class="btn sm" id="caixa">💬 Mensagens${nl?` <em class="bdg">${nl}</em>`:''}</button></div>
    <p class="vsubt">${euEst?(est.length?`Você e mais ${est.length} ${est.length>1?'colegas estão':'colega está'} estudando agora.`:'Só você por enquanto: os colegas que começarem aparecem aqui.'):(est.length?'Os colegas que estão com o cronômetro ligado agora. Toque em alguém para mandar uma mensagem.':'Ninguém com o cronômetro ligado agora. Comece a sua sessão!')}</p>
    ${est.map(pessoa).join('')}
    ${on.length?`<div class="vsub">Online no site · ${on.length}</div>${on.map(pessoa).join('')}`:''}
    <label class="vopt"><input type="checkbox" id="vOc" ${oc?'':'checked'}> Aparecer para os colegas</label>`;
  box.querySelectorAll('.viv').forEach(x=>x.onclick=()=>abreChat(x.dataset.u,x.dataset.n));
  $('caixa').onclick=abreCaixa;
  $('vOc').onchange=async()=>{await SB.rpc('set_oculto',{p:!$('vOc').checked});desenhaVivo();};}
function fechaChat(){if(CHAT){clearInterval(CHAT.t);CHAT.d.remove();CHAT=null;}desenhaVivo();}
async function abreCaixa(){if(CHAT)fechaChat();
  const d=document.createElement('div');d.className='dlg chat';d.innerHTML=`<div class="box" style="--c:#3A8CCB"><div class="top"><button class="x" data-x aria-label="Fechar">✕</button><h3>💬 Mensagens</h3><p>Suas conversas com os colegas</p></div><div class="lst" id="cxL"><p class="pend">Carregando…</p></div></div>`;
  document.body.appendChild(d);CHAT={d,t:null};d.onclick=e=>{if(e.target===d||e.target.closest('[data-x]'))fechaChat();};
  const {data}=await SB.rpc('minhas_conversas');const L=data||[];
  $('cxL').innerHTML=L.length?L.map(x=>`<button class="viv" data-u="${x.uid}" data-n="${esc(x.nome)}"><span class="av" style="--c:${x.estudando?'#1BAF7A':'#6B7393'}">${esc(iniN(x.nome))}${x.online?`<i class="${x.estudando?'on':'idle'}"></i>`:''}</span><span class="tx"><b>${esc(x.nome)}</b><small>${esc(x.ultima||'')}</small></span><span class="qd">${quandoMsg(x.quando)}${x.nao_lidas?`<em class="bdg">${x.nao_lidas}</em>`:''}</span></button>`).join(''):'<p class="pend" style="padding:6px 4px">Nenhuma conversa ainda. Em “Estudando agora”, toque num colega para mandar um oi.</p>';
  $('cxL').querySelectorAll('.viv').forEach(x=>x.onclick=()=>abreChat(x.dataset.u,x.dataset.n));}
async function abreChat(uid,nome){if(CHAT){clearInterval(CHAT.t);CHAT.d.remove();CHAT=null;}
  const d=document.createElement('div');d.className='dlg chat';d.innerHTML=`<div class="box" style="--c:#16304F"><div class="top"><button class="x" data-x aria-label="Fechar">✕</button><div class="cht"><span class="av" style="--c:#3A8CCB">${esc(iniN(nome))}</span><div><h3>${esc(nome)}</h3><p>${nome==='Prof. Jazz'?'Professor do PREPARA UFU':'Colega do PREPARA UFU'}</p></div></div>
    <div class="chops"><button type="button" data-a="blq">🚫 Bloquear</button><button type="button" data-a="den">⚑ Denunciar</button></div></div>
    <div class="blqbar" id="blqBar" hidden>Você bloqueou esta pessoa: ela não pode te mandar mensagens. <button type="button" data-a="desb">Desbloquear</button></div>
    <div class="msgs" id="msgs"><p class="pend" style="text-align:center">Carregando…</p></div>
    <form class="cin"><input name="t" maxlength="500" placeholder="Escreva uma mensagem…" autocomplete="off" aria-label="Mensagem"><button class="btn pri" type="submit">Enviar</button></form>
    <p class="regra">Esta conversa é só entre vocês. Se algo te incomodar, use “Denunciar”.</p><p class="msg" id="chErr"></p></div>`;
  document.body.appendChild(d);d.onclick=e=>{if(e.target===d||e.target.closest('[data-x]'))fechaChat();};
  let ult='';const carrega=async()=>{const {data}=await SB.rpc('conversa',{p_com:uid});if(!$('msgs'))return;const L=(data||[]).slice().reverse();const k=L.length+':'+(L.length?L[L.length-1].id:'');if(k===ult)return;ult=k;
    const m=$('msgs');m.innerHTML=L.length?L.map(x=>`<div class="bal${x.minha?' eu':''}"><span>${esc(x.texto)}</span><small>${quandoMsg(x.criada)}</small></div>`).join(''):'<p class="pend" style="text-align:center;margin:auto">Diga um oi! 👋</p>';m.scrollTop=m.scrollHeight;};
  CHAT={d,t:setInterval(carrega,4000)};carrega();
  const f=d.querySelector('form');
  const estBlq=b=>{$('blqBar').hidden=!b;f.t.disabled=b;f.querySelector('button').disabled=b;d.querySelector('[data-a=blq]').hidden=b;};
  SB.rpc('bloqueio',{p_com:uid,p_bloquear:null}).then(({data})=>estBlq(!!data));
  d.querySelector('[data-a=blq]').onclick=async()=>{if(!confirm('Bloquear '+nome+'? Essa pessoa não vai mais conseguir te mandar mensagens e some da sua lista.'))return;await SB.rpc('bloqueio',{p_com:uid,p_bloquear:true});estBlq(true);};
  d.querySelector('[data-a=desb]').onclick=async()=>{await SB.rpc('bloqueio',{p_com:uid,p_bloquear:false});estBlq(false);};
  d.querySelector('[data-a=den]').onclick=()=>{if(d.querySelector('.denf'))return;const w=document.createElement('form');w.className='denf';
    w.innerHTML=`<b>Denunciar ${esc(nome)}</b><p class="pend" style="margin:0">O Prof. Jazz recebe a denúncia com as mensagens desta conversa, e só desta. Ninguém mais fica sabendo.</p>
      <textarea name="m" rows="3" maxlength="1000" placeholder="O que aconteceu? (opcional)"></textarea>
      <label class="chk"><input type="checkbox" name="b" checked> Bloquear esta pessoa também</label>
      <div style="display:flex;gap:8px"><button class="btn pri" type="submit" style="flex:1;background:#E5484D;border-color:#E5484D">Enviar denúncia</button><button class="btn" type="button" data-a="can">Cancelar</button></div>`;
    d.querySelector('.msgs').before(w);w.querySelector('[data-a=can]').onclick=()=>w.remove();
    w.onsubmit=async e=>{e.preventDefault();const {error}=await SB.rpc('denunciar',{p_com:uid,p_motivo:w.m.value,p_bloquear:w.b.checked});
      if(error){$('chErr').textContent='Não deu para enviar a denúncia. Tente de novo.';return;}
      const bl=w.b.checked;w.innerHTML='<b style="color:#1BAF7A">✓ Denúncia enviada ao Prof. Jazz.</b>'+(bl?'<p class="pend" style="margin:0">Esta pessoa foi bloqueada.</p>':'');if(bl)estBlq(true);setTimeout(()=>w.remove(),4000);};};setTimeout(()=>f.t.focus(),50);
  f.onsubmit=async e=>{e.preventDefault();const t=f.t.value.trim();if(!t)return;f.t.value='';$('chErr').textContent='';
    const {error}=await SB.rpc('enviar_msg',{p_para:uid,p_texto:t});if(error){$('chErr').textContent=/muitas/.test(error.message)?'Muitas mensagens seguidas: espere um pouco.':/indisponivel/.test(error.message)?'Esta pessoa não está recebendo mensagens.':'Não deu para enviar. Tente de novo.';f.t.value=t;return;}ult='';carrega();};}

async function telaDen(){abas('tabDen');$('app').innerHTML='<p class="pend">Carregando…</p>';
  const {data,error}=await SB.rpc('admin_denuncias');if(error){$('app').innerHTML=`<div class="card"><p class="pend">${esc(error.message)}</p></div>`;return;}
  const L=data||[];const ab=L.filter(x=>!x.resolvida).length;
  $('app').innerHTML=`<div class="card" style="margin-bottom:14px"><h2 style="margin:0;font:800 22px var(--display)">Denúncias</h2><p class="pend" style="margin:4px 0 0">As conversas entre os alunos são privadas. Aqui aparecem só as que algum aluno denunciou, com as mensagens daquela conversa. ${ab?`<b style="color:#E5484D">${ab} em aberto.</b>`:'Nenhuma em aberto.'}</p></div>
   ${L.map(x=>`<details class="card den${x.resolvida?' ok':''}" style="margin-bottom:10px"><summary><b>${esc(x.de_nome)}</b> denunciou <b>${esc(x.contra_nome)}</b> <span class="pend">· ${quandoMsg(x.criada)} · ${x.resolvida?'resolvida':'<span style="color:#E5484D;font-weight:700">em aberto</span>'}</span></summary>
     <p class="pend" style="margin:8px 0">${esc(x.de)} → ${esc(x.contra)}</p>${x.motivo?`<p><b>Motivo:</b> ${esc(x.motivo)}</p>`:''}
     <div class="msgs" style="height:auto;max-height:360px;border-radius:12px">${(x.conversa||[]).map(m=>`<div class="bal${m.autor===x.de_nome?' eu':''}"><small style="align-self:flex-start;font-weight:700">${esc(m.autor)}</small><span>${esc(m.texto)}</span><small>${quandoMsg(m.criada)}</small></div>`).join('')||'<p class="pend">Sem mensagens.</p>'}</div>
     <button class="btn" data-id="${x.id}" data-r="${x.resolvida?0:1}" style="margin-top:10px">${x.resolvida?'Reabrir':'Marcar como resolvida'}</button></details>`).join('')}`;
  $('app').querySelectorAll('[data-r]').forEach(b=>b.onclick=async()=>{await SB.rpc('admin_resolver',{p_id:+b.dataset.id,p:b.dataset.r==='1'});telaDen();});}
entrar();
</script>
