<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Perfil de estudos · Assessoria ENEM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --azul:#3A8CCB; --amarelo:#DDDD24; --grafite:#222322; --laranja:#EB6834; --verde:#1BAF7A;
  --bg:#F4F6FB; --card:#FFFFFF; --ink:#141A2E; --muted:#5C6380; --line:#DDE1EC; --soft:#ECEFF6; --head:#16304F;
  --ok:#1A8A4C; --bad:#D33A2C; --shadow:0 1px 2px rgba(20,26,46,.05),0 6px 20px rgba(20,26,46,.06);
  --display:"Bricolage Grotesque","Avenir Next",system-ui,sans-serif; --body:"Public Sans",system-ui,sans-serif;
}
:root[data-theme="dark"]{--bg:#0B1020;--card:#151C2E;--ink:#EEF0F7;--muted:#9AA1BD;--line:#262E46;--soft:#1E2740;--shadow:none;color-scheme:dark;}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:400 15.5px/1.5 var(--body)}
header{background:var(--head);padding:14px 22px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-bottom:4px solid var(--amarelo);position:relative}
.logos{display:flex;align-items:center;gap:16px}
.logos img.j{height:46px}.logos img.p{height:34px}
.logos .sep{width:1px;height:40px;background:#55595E}
.ttl{color:#fff}
.ttl h1{font:700 18px/1.2 var(--display);margin:0}
.ttl p{margin:0;color:#BFC5CA;font-size:13.5px}
.tabs{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap}
.tabs a,.tabs button{font:600 14px var(--body);border:1px solid #4A4F55;background:transparent;color:#fff;padding:7px 14px;border-radius:999px;cursor:pointer;text-decoration:none}
.tabs .on{background:var(--azul);border-color:var(--azul)}
.theme{display:inline-flex!important;gap:2px;padding:3px!important;border:1px solid #3B5878!important;background:#0E2238!important}
.theme span{width:28px;height:26px;display:grid;place-items:center;border-radius:999px;color:#9FB3CC;font-size:15px}
:root:not([data-theme="dark"]) .theme .sun,:root[data-theme="dark"] .theme .moon{background:#fff;color:#16304F}
@media (max-width:760px){
  header{padding:12px 14px;gap:10px}
  .logos{gap:10px}.logos img.j{height:32px}.logos img.p{height:24px}.logos .sep{height:28px}
  .ttl{flex:1 1 100%}.ttl h1{font-size:17px}.ttl p{font-size:12.5px}
  .tabs{margin-left:0;flex:1 1 100%}
  .tabs a,.tabs button{padding:6px 11px;font-size:13px}
  .tabs .theme{position:absolute;top:13px;right:12px}
  html,body{overflow-x:clip}
}
main.largo{max-width:1280px}
main{max-width:860px;margin:0 auto;padding:22px 16px 60px;display:flex;flex-direction:column;gap:16px}
.intro{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow)}
.intro h2{margin:0 0 6px;font:800 24px var(--display)}
.intro p{margin:0;color:var(--muted)}
.sec{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px 20px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:16px}
.sec h3{margin:0;font:700 18px var(--display);display:flex;align-items:center;gap:10px}
.sec h3 .n{width:28px;height:28px;border-radius:50%;background:var(--azul);color:#fff;display:grid;place-items:center;font-size:14px;flex:none}
.f{display:flex;flex-direction:column;gap:6px}
.f[hidden]{display:none}
.f>label.q,.f>.q{font-weight:600;font-size:15px}
.f .h{color:var(--muted);font-size:13.5px;margin-top:-3px}
.req{color:var(--laranja)}
input[type=search],input[type=text],input[type=tel],input[type=number],input[type=time],input[type=email],input[type=password],select,textarea{font:500 15px var(--body);padding:9px 11px;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink);width:100%}
textarea{min-height:76px;resize:vertical}
input[type=time]{max-width:160px}input[type=number]{max-width:160px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts label{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 13px;cursor:pointer;font-size:14.5px}
.opts label:has(input:checked){border-color:var(--azul);background:rgba(58,140,203,.14)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
.grid{border-collapse:collapse;width:100%;font-size:14px}
.grid th,.grid td{border:1px solid var(--line);padding:6px 4px;text-align:center}
.grid th{background:var(--soft);font-weight:600}
.grid td:first-child{text-align:left;padding-left:8px;font-weight:600;white-space:nowrap}
.grid input{width:20px;height:20px;cursor:pointer;accent-color:var(--azul)}
.scale{display:grid;grid-template-columns:minmax(120px,1fr) repeat(4,minmax(58px,76px));gap:6px;align-items:center;font-size:14.5px}
.scale .hd{color:var(--muted);font-size:12.5px;text-align:center}
.scale label{display:grid;place-items:center}
.scale input{width:20px;height:20px;accent-color:var(--azul)}
@media (max-width:480px){.scale{grid-template-columns:minmax(92px,1fr) repeat(4,52px);font-size:13.5px}.scale .hd{font-size:11px}}
.btn{font:600 15px var(--body);border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:10px 16px;border-radius:9px;cursor:pointer}
.btn.pri{background:var(--azul);border-color:var(--azul);color:#fff}
.btn:disabled{opacity:.55;cursor:not-allowed}
.send{position:sticky;bottom:0;background:linear-gradient(transparent,var(--bg) 30%);padding:18px 0 8px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#msg{font-size:14.5px}#msg.ok{color:var(--ok)}#msg.err{color:var(--bad)}
.done{border-left:5px solid var(--verde)}
.aviso{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:26px;text-align:center}
.aviso h2{font:800 22px var(--display);margin:0 0 8px}.aviso p{color:var(--muted);margin:0 0 16px}
.aviso a{color:#fff;background:var(--azul);padding:10px 18px;border-radius:9px;text-decoration:none;font-weight:600}
.fx{display:flex;flex-direction:column;gap:10px}
.fxl{border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px}
.fxt{display:grid;grid-template-columns:200px 1fr 34px;gap:8px}
.fxt select,.fxt input,.fxh input{background:var(--card)}
.fx-del{border:1px solid var(--line);background:var(--card);color:var(--bad);border-radius:8px;cursor:pointer;font-size:15px}
.fxd{display:flex;flex-wrap:wrap;gap:6px}
.fxd label{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13.5px;cursor:pointer;background:var(--card)}
.fxd label:has(input:checked){border-color:var(--azul);background:rgba(58,140,203,.16)}
.fxh{display:flex;align-items:center;gap:8px;font-size:14px;color:var(--muted)}
.fxh input{max-width:130px}
@media (max-width:560px){.fxt{grid-template-columns:1fr 34px}.fxt .fx-desc{grid-column:1/-1;grid-row:2}}
.kps{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.kp{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:2px}
.kp b{font:800 20px var(--display);line-height:1.15}.kp span{color:var(--muted);font-size:13px}
.alu .kp{background:var(--bg)}
@media (max-width:560px){.kps{grid-template-columns:repeat(2,minmax(0,1fr))}.kp b{font-size:17px}.alu .kp b{font-size:15px}}.alu .kp b{font-size:16px}
.gg{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px;align-items:start}
.gc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:7px}
.gc h4{margin:0 0 4px;font:700 15px var(--display)}.gs{margin:-6px 0 2px;color:var(--muted);font-size:12.5px}
.br{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(60px,1fr) 42px 26px;gap:8px;align-items:center;font-size:13.5px}
.bl{line-height:1.25}
.bt{height:12px;background:var(--soft);border-radius:99px;overflow:hidden}.bt i{display:block;height:100%;border-radius:99px}
.br b{text-align:right;font-variant-numeric:tabular-nums}.br small{color:var(--muted);text-align:right}
.heat{border-collapse:collapse;width:100%;font-size:13px}.heat th,.heat td{border:1px solid var(--line);padding:5px;text-align:center}.heat td:first-child{text-align:left;font-weight:600}
.ag{display:grid;grid-template-columns:38px repeat(7,minmax(70px,1fr));gap:0 3px;overflow-x:auto;font-size:11.5px;margin-top:4px}
.agh{text-align:center;font-weight:700;padding:4px 0;color:var(--muted)}
.agt{position:relative}.agt span{position:absolute;right:4px;transform:translateY(-50%);color:var(--muted);font-size:10.5px}
.agc{position:relative;background:repeating-linear-gradient(to bottom,var(--soft) 0 1px,transparent 1px 40px);border-radius:6px;background-color:var(--bg)}
.ev{position:absolute;left:2px;right:2px;border-radius:6px;overflow:hidden;padding:5px 7px;line-height:1.2;box-sizing:border-box}
.ev.fx1{display:flex;flex-direction:column;gap:1px}.ev.fx1 b{font-size:11.5px}.ev .hr{font-size:10.5px;opacity:.95}
.ev.f2{padding:3px 6px;line-height:1.12}.ev.f2 b{font-size:10.5px}.ev.f3{display:block}.ev.f3 b{margin-right:3px}.ev.f3 .hr{display:inline-block}.ev.f4{padding:2px 5px;font-size:9.5px;line-height:1.1}.ev.f4 b,.ev.f4 .hr{font-size:9.5px}
.ev.sono{background:repeating-linear-gradient(45deg,rgba(120,130,160,.28) 0 6px,rgba(120,130,160,.12) 6px 12px);color:var(--muted);left:0;right:0;border-radius:0;font-size:10.5px}
.ev.livre{border:2px dashed var(--verde);background:rgba(27,175,122,.08);left:0;right:0}
.ev.fx1{color:#fff;font-size:11px;box-shadow:0 1px 3px rgba(0,0,0,.25);z-index:2}
.leg{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:8px}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:5px;vertical-align:-2px}
.leg i.sono{background:rgba(120,130,160,.4)}.leg i.livre{border:2px dashed var(--verde)}
.cbanner{background:rgba(221,221,36,.14);border:1px solid var(--amarelo);border-radius:12px;padding:12px 14px;font-size:15px}
.caviso{background:rgba(235,104,52,.12);border:1px solid var(--laranja);border-radius:12px;padding:10px 14px;font-size:14.5px;margin-top:8px}
.cgw{overflow-x:auto;margin-top:12px}
.cg{display:grid;grid-template-columns:40px repeat(7,minmax(118px,1fr));gap:0 4px;min-width:900px}
.cgh{text-align:center;font:700 13px var(--display);padding:6px 0;color:var(--muted)}
.cgt{position:relative}.cgt span{position:absolute;right:5px;transform:translateY(-50%);font-size:11px;color:var(--muted)}
.cgc{position:relative;border-radius:8px;background-color:var(--bg);background-image:linear-gradient(to bottom,var(--line) 1px,transparent 1px)}
.cb{position:absolute;left:3px;right:3px;border-radius:8px;padding:6px 9px;overflow:hidden;font-size:12px;line-height:1.22;display:flex;flex-direction:column;gap:1px;box-shadow:0 1px 2px rgba(0,0,0,.2);box-sizing:border-box}
.cb b{font-weight:700;font-size:12.5px}
.cb .ds,.ev .ds{font-style:normal;font-size:11.5px;opacity:.85}.cb .hr,.ev .hr{white-space:nowrap}.cb .hr{font-size:11.5px;opacity:.95;font-variant-numeric:tabular-nums}
.cb.f1 .ds,.ev.f1 .ds{display:none}
.cb.f2{padding:4px 8px;line-height:1.15;font-size:11.5px}.cb.f2 b{font-size:11.5px}.cb.f2 .hr{font-size:11px}
.cb.f3{display:block}.cb.f3 b{margin-right:4px}.cb.f3 .hr{display:inline-block;white-space:nowrap}
.cb.f4{padding:3px 6px;font-size:10.5px;line-height:1.1}.cb.f4 b,.cb.f4 .hr{font-size:10.5px}

.cb.fixo,.cli.fixo{background:repeating-linear-gradient(45deg,var(--soft) 0 6px,var(--card) 6px 12px);color:var(--muted);box-shadow:none;border:1px solid var(--line)}
.cb.prepara,.cli.prepara{background:#16304F;color:#fff;border:2px solid var(--amarelo)}
.cb.sim,.cli.sim{background:#212529;color:#fff;border:2px solid var(--amarelo)}
.cb.rev,.cli.rev{background:var(--card);color:var(--ink);border:2px solid #868E96}
.clw{display:none}
@media (max-width:760px){.cgw{display:none}.clw{display:flex;flex-direction:column;gap:10px;margin-top:12px}}
.cl h5{margin:0 0 6px;font:700 15px var(--display)}
.cli{display:flex;gap:10px;align-items:center;border-radius:9px;padding:8px 10px;margin-bottom:5px;font-size:14px}
.cli span{font-variant-numeric:tabular-nums;font-size:13px;min-width:92px}
.cleg i.fx{background:repeating-linear-gradient(45deg,var(--soft) 0 4px,var(--card) 4px 8px);border:1px solid var(--line)}
.cleg{margin-top:10px}
.cr{border-collapse:collapse;width:100%;font-size:14px}.cr th,.cr td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left}
.cr th{color:var(--muted);font-weight:600;font-size:12.5px}.cr td i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}
.cr .tt td{font-weight:700}.falt{color:var(--laranja);font-size:12.5px}
@media print{header,.tabs,.intro,.btn{display:none!important}body{background:#fff;color:#000}.sec{border:0;box-shadow:none}.cgw{overflow:visible}.cb{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.ctb{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px}
.cst{font-size:13.5px;color:var(--muted)}.cst.ok{color:var(--ok)}.cst.err{color:var(--bad)}
.chint{margin:8px 0 0}.somob{display:none}
@media (max-width:760px){.sodesk{display:none}.somob{display:inline}}
.cb.mov{cursor:grab;touch-action:none}.cb.mov:hover{filter:brightness(1.08);outline:2px solid rgba(255,255,255,.55)}
.cb.arr{z-index:20;opacity:.9;cursor:grabbing;box-shadow:0 8px 20px rgba(0,0,0,.35)}
.cb.conf,.cli.conf{outline:3px solid var(--bad);outline-offset:-1px}
.cli.mov{cursor:pointer}.cli em{margin-left:auto;font-style:normal;font-size:12px;opacity:.85;text-decoration:underline}
.cdlg{position:fixed;inset:0;z-index:60;background:rgba(5,8,18,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.cdlg .box{background:var(--card);color:var(--ink);border-radius:16px;padding:20px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.4)}
.cdlg h3{margin:0;font:800 20px var(--display)}
.cdlg label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}
.cdlg label[hidden]{display:none}
.cdlg .btns{display:flex;gap:8px;flex-wrap:wrap}.cdlg .del{color:var(--bad)}
.cerr{margin:0;color:var(--bad);font-size:13.5px;min-height:0}
@media print{.ctb,.chint,.cdlg{display:none!important}}
#exBar{background:var(--amarelo);color:#16304F;font:600 14px var(--body);padding:8px 16px;text-align:center;position:sticky;top:0;z-index:30}
#exBar[hidden]{display:none}
#exBar button{margin-left:10px;font:700 13px var(--body);background:#16304F;color:#fff;border:0;border-radius:999px;padding:5px 12px;cursor:pointer}
.exacoes{display:flex;flex-wrap:wrap;gap:8px;align-items:center;background:rgba(221,221,36,.12);border:1px dashed var(--amarelo);border-radius:12px;padding:10px 14px;font-size:14px}
.hdia{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.hdia label{display:flex;flex-direction:column;gap:4px;font-size:14px;font-weight:600}
.cw{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin-top:12px;align-items:start}
@media (max-width:1180px){.cw{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.cw{grid-template-columns:1fr}}
.cd{background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:6px;min-height:120px}
.cd.alvo{border-color:var(--azul);box-shadow:0 0 0 2px rgba(58,140,203,.35)}
.cdh{display:flex;flex-direction:column;gap:1px;margin-bottom:2px}.cdh b{font:700 15px var(--display)}.cdh small{color:var(--muted);font-size:12px}.cdh small.exc{color:var(--bad);font-weight:600}
.cdsec{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-top:4px}
.cde{display:flex;flex-direction:column;gap:6px;min-height:30px}
.ci{border-radius:9px;padding:8px 10px;display:flex;flex-direction:column;gap:2px;line-height:1.25;overflow-wrap:normal;word-break:normal;hyphens:none}
.ci b{font-size:13px;font-weight:700}.ci span{font-size:12.5px;opacity:.92;font-variant-numeric:tabular-nums;white-space:nowrap}
.ci.fixo{background:repeating-linear-gradient(45deg,var(--soft) 0 6px,var(--card) 6px 12px);color:var(--muted);border:1px solid var(--line)}
.ci.prepara{background:#16304F;color:#fff;border:2px solid var(--amarelo)}
.ci.sim{background:#212529;color:#fff;border:2px solid var(--amarelo)}
.ci.rev{background:var(--card);color:var(--ink);border:2px solid #868E96}
.cde .ci{cursor:grab;box-shadow:0 1px 2px rgba(0,0,0,.18)}.cde .ci:hover{filter:brightness(1.06)}
.ci.arr{opacity:.4}
.vz{margin:0;color:var(--muted);font-size:12.5px}
@media (max-width:760px){.cd{min-height:0}.ci{flex-direction:row;justify-content:space-between;align-items:center;gap:10px}}
@media print{.cw{grid-template-columns:repeat(7,1fr)}.ci{-webkit-print-color-adjust:exact;print-color-adjust:exact}}
.faq h3{margin-bottom:2px}.faq details{border-top:1px solid var(--line);padding:10px 2px}.faq details:first-of-type{border-top:0}
.faq summary{cursor:pointer;font-weight:600;font-size:15px;list-style:none;display:flex;gap:8px}.faq summary::-webkit-details-marker{display:none}
.faq summary::before{content:"+";color:var(--azul);font-weight:800;width:14px;flex:none}.faq details[open] summary::before{content:"–"}
.faq p{margin:8px 0 2px 22px;color:var(--muted);line-height:1.55}
/* login */
#gate{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
#gate[hidden]{display:none}
#gate .box{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);max-width:400px;width:100%;overflow:hidden}
#gate .top{background:var(--head);border-bottom:4px solid var(--amarelo);padding:18px;display:flex;gap:14px;align-items:center;justify-content:center}
#gate .top img{height:38px}
#gate form{padding:20px 22px 22px;display:flex;flex-direction:column;gap:12px}
#gate h2{margin:0;font:800 22px var(--display)}
#gate p{margin:0;color:var(--muted);font-size:14px}
#gate .lnk{background:none;border:0;color:var(--azul);font:600 14px var(--body);cursor:pointer;padding:2px}
#gMsg{min-height:20px;font-size:14px;color:var(--bad)}#gMsg.ok{color:var(--ok)}
/* painel do professor */
.adm-top{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.adm-top input{flex:1;min-width:200px}
.alu{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.alu summary{padding:13px 16px;cursor:pointer;display:flex;gap:10px;align-items:center;flex-wrap:wrap;list-style:none}
.alu summary::-webkit-details-marker{display:none}
.alu summary b{font-size:16px}
.alu summary .m{color:var(--muted);font-size:13.5px}
.alu summary .d{margin-left:auto;color:var(--muted);font-size:13px}
.alu .corpo{padding:4px 16px 16px;border-top:1px solid var(--line)}
.alu h4{margin:14px 0 6px;font:700 15px var(--display);color:var(--azul)}
.alu dl{display:grid;grid-template-columns:minmax(160px,34%) 1fr;gap:4px 14px;margin:0;font-size:14.5px}
.alu dt{color:var(--muted)}.alu dd{margin:0;white-space:pre-wrap}

function campo(f){
  const id='q_'+f.k,rq=f.req?' <span class="req">*</span>':'',h=f.h?`<div class="h">${esc(f.h)}</div>`:'';
  let inner='';
  if(['text','tel','time','number'].includes(f.type))inner=`<input id="${id}" name="${f.k}" type="${f.type}" placeholder="${esc(f.ph||'')}">`;
  else if(f.type==='textarea')inner=`<textarea id="${id}" name="${f.k}" placeholder="${esc(f.ph||'')}"></textarea>`;
  else if(f.type==='select')inner=`<select id="${id}" name="${f.k}"><option value="">Escolha…</option>${f.opts.map(o=>`<option>${esc(o)}</option>`).join('')}</select>`;
  else if(f.type==='radio'||f.type==='checks')inner=`<div class="opts" role="${f.type==='radio'?'radiogroup':'group'}">${f.opts.map(o=>`<label><input type="${f.type==='radio'?'radio':'checkbox'}" name="${f.k}" value="${esc(o)}"> ${esc(o)}</label>`).join('')}</div>`;
  else if(f.type==='grid')inner=`<div style="overflow-x:auto"><table class="grid"><tr><th></th>${TURNOS.map(t=>`<th>${t}</th>`).join('')}</tr>${DIAS.map(d=>`<tr><td>${d}</td>${TURNOS.map(t=>`<td><input type="checkbox" name="disp" value="${d}|${t}" aria-label="${d} — ${t}"></td>`).join('')}</tr>`).join('')}</table></div>`;
  else if(f.type==='horasdia')inner=`<div class="hdia">${DS.map((d,i)=>`<label><span>${DIAS[i]}</span><select name="hd_${d}"><option value="">Escolha…</option><option>Não estudo</option>${HORAS.map(o=>`<option>${o}</option>`).join('')}</select></label>`).join('')}</div>`;
  else if(f.type==='fixos')inner=`<div class="fx" id="fx"></div><button type="button" class="btn" id="fxAdd" style="align-self:flex-start">+ Adicionar compromisso</button>`;
  else if(f.type==='scale')inner=`<div class="scale"><span></span>${DIFN.map(n=>`<span class="hd">${n}</span>`).join('')}${AREAS.map((a,i)=>`<span>${esc(a)}</span>${[1,2,3,4].map(n=>`<label><input type="radio" name="nivel_${i}" value="${n}" aria-label="${esc(a)}: ${DIFN[n-1]}"></label>`).join('')}`).join('')}</div>`;
  const lab=['radio','checks','grid','scale'].includes(f.type)?`<div class="q">${esc(f.l)}${rq}</div>`:`<label class="q" for="${id}">${esc(f.l)}${rq}</label>`;
  return `<div class="f" data-k="${f.k}">${lab}${h}${inner}</div>`;
}
const CAMPOS=S.flatMap(s=>s.f);
const TIPOS=['Escola','Cursinho','Trabalho / estágio','Academia / esporte','Consulta médica','Fisioterapia','Psicólogo / terapia','Mentoria','Aula particular','Curso de idioma','Música / arte','Igreja','Deslocamento','Outro'];
const DS=['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
function fxLinha(v={}){const d=document.createElement('div');d.className='fxl';
  d.innerHTML=`<div class="fxt"><select class="fx-tipo" aria-label="Tipo de compromisso"><option value="">Tipo…</option>${TIPOS.map(t=>`<option${v.tipo===t?' selected':''}>${t}</option>`).join('')}</select><input type="text" class="fx-desc" placeholder="Detalhe (ex.: Colégio X, natação, Dra. Ana)" value="${esc(v.desc||'')}"><button type="button" class="fx-del" aria-label="Remover compromisso" title="Remover">✕</button></div>
  <div class="fxd">${DS.map(x=>`<label><input type="checkbox" value="${x}"${(v.dias||[]).includes(x)?' checked':''}> ${x}</label>`).join('')}</div>
  <div class="fxh"><span>das</span><input type="time" class="fx-ini" value="${esc(v.ini||'')}" aria-label="Início"><span>às</span><input type="time" class="fx-fim" value="${esc(v.fim||'')}" aria-label="Fim"></div>`;
  d.querySelector('.fx-del').onclick=()=>{d.remove();if(!$('fx').children.length)fxLinha();};
  $('fx').appendChild(d);}
function fxLer(){return [...document.querySelectorAll('.fxl')].map(d=>({tipo:d.querySelector('.fx-tipo').value,desc:d.querySelector('.fx-desc').value.trim(),dias:[...d.querySelectorAll('.fxd input:checked')].map(i=>i.value),ini:d.querySelector('.fx-ini').value,fim:d.querySelector('.fx-fim').value})).filter(x=>x.tipo||x.desc||x.dias.length||x.ini);}
function fxIncompleto(L){return L.find(x=>!x.tipo||!x.dias.length||!x.ini||!x.fim);}
function ler(){const fm=$('ck'),r={};
  CAMPOS.forEach(f=>{
    if(f.type==='checks')r[f.k]=[...fm.querySelectorAll(`input[name="${f.k}"]:checked`)].map(i=>i.value);
    else if(f.type==='radio'){const c=fm.querySelector(`input[name="${f.k}"]:checked`);r[f.k]=c?c.value:'';}
    else if(f.type==='grid')r.disp=[...fm.querySelectorAll('input[name="disp"]:checked')].map(i=>i.value);
    else if(f.type==='horasdia'){r.horas_dia={};DS.forEach(d=>{const v=fm.querySelector(`[name="hd_${d}"]`).value;if(v)r.horas_dia[d]=v;});}
    else if(f.type==='fixos')r.fixos=fxLer();
    else if(f.type==='scale'){r.nivel={};AREAS.forEach((a,i)=>{const c=fm.querySelector(`input[name="nivel_${i}"]:checked`);r.nivel[a]=c?+c.value:null;});}
    else r[f.k]=(fm.querySelector(`[name="${f.k}"]`).value||'').trim();});
  return r;}
function preencher(r){const fm=$('ck');
  CAMPOS.forEach(f=>{const v=r[f.k];if(v==null)return;
    if(f.type==='checks'||f.type==='grid')fm.querySelectorAll(`input[name="${f.k}"]`).forEach(i=>i.checked=(v||[]).includes(i.value));
    else if(f.type==='radio')fm.querySelectorAll(`input[name="${f.k}"]`).forEach(i=>i.checked=i.value===v);
    else if(f.type==='horasdia')DS.forEach(d=>{const e=fm.querySelector(`[name="hd_${d}"]`);if(e)e.value=(v||{})[d]||'';});
    else if(f.type==='fixos'){$('fx').innerHTML='';(v.length?v:[{}]).forEach(fxLinha);}
    else if(f.type==='scale')AREAS.forEach((a,i)=>fm.querySelectorAll(`input[name="nivel_${i}"]`).forEach(x=>x.checked=+x.value===(v||{})[a]));
    else fm.querySelector(`[name="${f.k}"]`).value=v;});}
function visiveis(){const r=ler();CAMPOS.forEach(f=>{if(f.show){const el=document.querySelector(`.f[data-k="${f.k}"]`);el.hidden=!f.show(r);}});}
function faltando(r){const L=[];CAMPOS.forEach(f=>{if(!f.req)return;if(f.show&&!f.show(r))return;
  const v=r[f.k];const vazio=f.type==='horasdia'?DS.some(d=>!(v||{})[d]):f.type==='scale'?AREAS.some(a=>!(v||{})[a]):Array.isArray(v)?!v.length:!v;if(vazio)L.push(f);});return L;}

async function telaForm(){
  abas('tabForm');
  $('app').innerHTML=`<div class="intro" id="intro"><h2>Meu perfil de estudos</h2><p>Responda com sinceridade: com essas respostas o Prof. Jazz monta o seu cronograma de estudos e a sua revisão. Leva uns 10 minutos. Você pode voltar aqui e alterar depois.</p></div>
  <form id="ck" novalidate>${S.map((s,i)=>`<section class="sec"><h3><span class="n">${i+1}</span>${esc(s.t)}</h3>${s.f.map(campo).join('')}</section>`).join('<div style="height:16px"></div>')}
  <div class="send"><button class="btn pri" id="enviar" type="submit">Enviar perfil de estudos</button><span id="msg" role="status"></span></div></form>`;
  ['Escola',''].forEach((t,i)=>fxLinha(i?{}:{tipo:t}));$('fxAdd').onclick=()=>fxLinha();
  exemploAcoes();
  const fm=$('ck');fm.addEventListener('input',visiveis);fm.addEventListener('change',visiveis);
  const {data}=await SB.from('checkup').select('respostas,atualizado_em').eq('email',ALVO).maybeSingle();
  if(data){preencher(data.respostas);$('intro').classList.add('done');$('intro').insertAdjacentHTML('beforeend',`<p style="margin-top:8px;color:var(--ok);font-weight:600">✓ Perfil de estudos enviado em ${new Date(data.atualizado_em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})}. Se algo mudou, altere e envie de novo.</p>`);$('enviar').textContent='Atualizar perfil de estudos';}
  visiveis();
  fm.onsubmit=async ev=>{ev.preventDefault();const r=ler();CAMPOS.forEach(f=>{if(f.show&&!f.show(r))delete r[f.k];});const f=faltando(r),m=$('msg');
    if(f.length){m.className='err';m.textContent='Falta responder: '+f.map(x=>x.l.replace(/\?.*$/,'?')).slice(0,3).join(' · ')+(f.length>3?` (e mais ${f.length-3})`:'');
      document.querySelector(`.f[data-k="${f[0].k}"]`).scrollIntoView({behavior:'smooth',block:'center'});return;}
    const inc=fxIncompleto(r.fixos||[]);
    if(inc){m.className='err';m.textContent='Complete cada compromisso fixo: tipo, dias e horário de início e fim (ou remova a linha vazia com ✕).';document.querySelector('.f[data-k="fixos"]').scrollIntoView({behavior:'smooth',block:'center'});return;}
    $('enviar').disabled=true;m.className='';m.textContent='Enviando…';
    const agora=new Date().toISOString();
    const {error}=await SB.from('checkup').upsert({email:ALVO,respostas:r,atualizado_em:agora},{onConflict:'email'});
    $('enviar').disabled=false;
    if(error){m.className='err';m.textContent='Não foi possível enviar: '+error.message;return;}
    m.className='ok';m.innerHTML='✓ Perfil de estudos salvo! Se você mudou a rotina, o seu pré-cronograma se reorganiza sozinho ao abrir. <button type="button" class="btn pri" id="verCrono" style="margin-left:8px">Ver meu pré-cronograma</button>';$('tabCrono').hidden=false;$('verCrono').onclick=telaCrono;$('enviar').textContent='Atualizar perfil de estudos';};
}

/* ===== Área do professor ===== */
function horasDia(p){const o={};if(p.horas_dia&&Object.keys(p.horas_dia).length){DS.forEach(d=>o[d]=hnum(p.horas_dia[d]));return o;}
  const sem=Math.max(hnum(p.horas_semana),hnum(p.horas_possiveis));DS.slice(0,5).forEach(d=>o[d]=sem);o['Sáb']=hnum(p.horas_sab);o['Dom']=hnum(p.horas_dom);return o;}
const hnum=v=>{if(!v||v==='Não estudo')return 0;if(v==='Menos de 1 h')return .5;const m=v.match(/(\d+) h(?: (\d+))?/);return m?+m[1]+(m[2]?+m[2]/60:0):0;};
const hfmt=h=>{const H=Math.floor(h),M=Math.round((h-H)*60);return M?`${H} h ${String(M).padStart(2,'0')}`:`${H} h`;};
const tmin=t=>{if(!t)return null;const [h,m]=t.split(':').map(Number);return h*60+m;};
const mfmt=m=>{m=((Math.round(m)%1440)+1440)%1440;return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');};
const COR={'Escola':'#3A8CCB','Cursinho':'#7B61FF','Trabalho / estágio':'#EB6834','Academia / esporte':'#1BAF7A','Consulta médica':'#E0559B','Fisioterapia':'#E0559B','Psicólogo / terapia':'#E0559B','Mentoria':'#C9A227','Aula particular':'#C9A227','Curso de idioma':'#2BB3C0','Música / arte':'#2BB3C0','Igreja':'#8A93A6','Deslocamento':'#8A93A6','Outro':'#8A93A6'};
function fmt(f,v){
  if(v==null||v===''||(Array.isArray(v)&&!v.length))return '';
  if(f.type==='grid'){return DIAS.map(d=>{const t=TURNOS.filter(t=>v.includes(d+'|'+t));return t.length?d+': '+t.join(', '):'';}).filter(Boolean).join('\n');}
  if(f.type==='horasdia')return DS.map(d=>d+': '+((v||{})[d]||'—')).join(' · ');
  if(f.type==='fixos')return v.map(x=>`${x.tipo}${x.desc?' ('+x.desc+')':''}: ${x.dias.join(', ')} · ${x.ini||'?'}–${x.fim||'?'}`).join('\n');
  if(f.type==='scale')return AREAS.map(a=>a+': '+(v[a]?DIFN[v[a]-1]:'—')).join('\n');
  return Array.isArray(v)?v.join(', '):String(v);}
let RESP=[],LIB=[],EXR=null,LST=[];
function abas(on){$('app').classList.toggle('largo',!['tabForm','tabFaq'].includes(on));['tabGeral','tabResp','tabForm','tabCrono','tabFaq'].forEach(t=>$(t).classList.toggle('on',t===on));}
async function carregar(){

  ['As matérias têm horário marcado?','Não. Só os compromissos (escola, cursinho, academia, psicólogo, PREPARA UFU…) aparecem com horário. As matérias aparecem só com a duração: você escolhe o melhor momento do dia para estudar, seguindo a ordem sugerida.'],
  ['Por que umas matérias aparecem mais vezes que outras?','O cronograma dá mais espaço para as matérias que você marcou como difíceis e para as que pesam mais no seu curso. Matemática, Física e Química sempre aparecem mais vezes. Redação entra uma vez por semana, a revisão entra quase todos os dias e o domingo é para simulado, provas antigas da UFU e matéria atrasada.'],
  ['As aulas do PREPARA UFU contam como tempo de estudo?','Não. As aulas ao vivo (segunda e quinta, 19h–20h30) aparecem como compromisso e não entram nas suas horas de estudo: o seu tempo de estudo é além delas.']]],
 ['Mudar a rotina e as horas',[
  ['Como mudo a quantidade de horas que estudo por dia?','Abra "Meu perfil de estudos", vá até "Quantas horas você estuda em cada dia da semana?", escolha as novas horas de cada dia e clique em "Atualizar perfil de estudos". Se você ainda não tinha mexido no cronograma, ele se monta de novo com as novas horas. Se já tinha mexido, os blocos que passarem do novo total vão sozinhos para dias com espaço. Para montar tudo de novo, use "Montar de novo pelo perfil de estudos".'],
  ['Mudou um compromisso (academia, escola, cursinho, trabalho). O que faço?','Em "Meu perfil de estudos", na parte "Seus compromissos fixos", altere a linha do compromisso (dias e horário), exclua com o ✕ ou adicione um novo em "+ Adicionar compromisso". Depois clique em "Atualizar perfil de estudos". O compromisso aparece atualizado no seu cronograma.'],
  ['Como coloco o cursinho?','Coloque só o horário das aulas do cursinho. O tempo em que você fica lá estudando sozinho é tempo de estudo: conte nas horas de cada dia.'],
  ['Mudei de curso ou de dificuldade em alguma matéria. Como atualizo?','Altere no perfil (curso e grau de dificuldade por matéria), clique em "Atualizar perfil de estudos" e, no cronograma, clique em "Montar de novo pelo perfil de estudos" para redistribuir as matérias.']]],
 ['Mexer no cronograma',[
  ['Como mudo um bloco de dia ou de lugar?','No computador, clique e arraste o bloco da matéria para outro dia ou para cima/baixo no mesmo dia, para mudar a ordem. No celular, toque no bloco, escolha o novo dia e clique em "Salvar".'],
  ['Como mudo a duração de um bloco?','Clique (ou toque) no bloco, escolha a nova duração e clique em "Salvar".'],
  ['Como troco a matéria de um bloco?','Clique no bloco, escolha outra matéria em "Matéria / atividade" e clique em "Salvar".'],
  ['Como acrescento um bloco?','Clique em "+ Adicionar bloco", escolha a matéria (ou "Outro" para escrever o nome, como "Lista de exercícios"), o dia e a duração, e clique em "Adicionar".'],
  ['Como excluo um bloco?','Clique no bloco e depois em "Excluir bloco". Só não dá para excluir (nem trocar) o último bloco de uma matéria: toda matéria precisa aparecer pelo menos uma vez na semana. Nesse caso, mude o dia ou a duração.'],
  ['Por que apareceu "Precisamos diminuir…"?','Quando o seu tempo é curto, o cronograma tira uma repetição da matéria que mais aparece para caber as que estavam faltando, porque toda matéria precisa aparecer pelo menos uma vez na semana. Com mais horas de estudo no perfil, as repetições voltam.'],
  ['Posso mudar os compromissos direto no cronograma?','Não. Compromissos vêm do seu perfil de estudos: para mudar, altere o perfil (veja "Mudou um compromisso").'],
  ['Como refaço o cronograma do zero?','Clique em "Montar de novo pelo perfil de estudos". Atenção: isso apaga todas as mudanças que você fez e monta tudo de novo a partir do seu perfil.'],
  ['As minhas mudanças ficam salvas?','Sim, salvam sozinhas: aparece "✓ Salvo às…" ao lado dos botões. O Prof. Jazz vê o seu cronograma e também pode ajustá-lo no seu encontro.'],
  ['Apareceu "A quantidade de horas que você estuda é insuficiente". E agora?','Significa que as horas que você marcou não comportam todas as matérias de que você precisa. As que ficaram de fora aparecem no aviso. Você pode aumentar as horas no perfil ou conversar com o mentor no seu encontro.'],
  ['Como imprimo ou salvo em PDF?','Clique em "Imprimir / PDF" e, na janela de impressão, escolha a impressora ou "Salvar como PDF".']]],
 ['Acesso',[
  ['Esqueci a minha senha. O que faço?','Fale com o Prof. Jazz: ele zera a sua senha e você cria uma nova em "Primeiro acesso? Crie sua senha", com o mesmo e-mail.'],
  ['A senha é a mesma do Banco de Questões?','Sim. É a mesma conta: você entra no Banco de Questões e na área da Assessoria com o mesmo e-mail e a mesma senha.']]]];
function telaFaq(){abas('tabFaq');
  $('app').innerHTML=`<div class="intro"><h2>Dúvidas</h2><p>Perguntas e respostas sobre o perfil de estudos e o pré-cronograma. Não achou a sua dúvida? Fale com o Prof. Jazz.</p></div>
  ${FAQ.map(([t,L])=>`<section class="sec faq"><h3>${esc(t)}</h3>${L.map(([q,a])=>`<details><summary>${esc(q)}</summary><p>${esc(a)}</p></details>`).join('')}</section>`).join('')}`;}
async function telaCrono(){abas('tabCrono');
  const {data}=await SB.from('checkup').select('respostas').eq('email',ALVO).maybeSingle();
  if(!data){$('app').innerHTML='<div class="aviso"><h2>Preencha o seu perfil de estudos primeiro</h2><p>O seu pré-cronograma é montado a partir das suas respostas.</p></div>';return;}
  $('app').innerHTML=`<div class="intro"><h2>Meu pré-cronograma</h2><p>Montado a partir do seu perfil de estudos. Você pode arrastar, alterar, excluir e adicionar blocos: as mudanças ficam salvas, e o Prof. Jazz vê e ajusta com você no encontro.</p></div><div class="sec" id="cronoBox"></div>`;
  montarCrono($('cronoBox'),data.respostas,ALVO,'aluno');}

/* ===== Login (mesma conta do Banco de Questões) ===== */
let novo=false;
const gm=(t,ok)=>{$('gMsg').textContent=t;$('gMsg').className=ok?'ok':'';};
function modo(n){novo=n;$('gPass2').hidden=!n;$('gPass2').required=n;$('gBtn').textContent=n?'Criar senha e entrar':'Entrar';
  $('gMode').textContent=n?'Já tenho senha — entrar':'Primeiro acesso? Crie sua senha';
  $('gTxt').textContent=n?'Use o e-mail que o Prof. Jazz liberou e escolha uma senha.':'Entre com o mesmo e-mail e senha do Banco de Questões.';gm('');}
$('gMode').onclick=()=>modo(!novo);
$('gForm').onsubmit=async ev=>{ev.preventDefault();const email=$('gEmail').value.trim().toLowerCase(),password=$('gPass').value;$('gBtn').disabled=true;gm('Aguarde…',true);
  try{
    if(novo){if(password!==$('gPass2').value)throw new Error('As senhas não conferem.');
      const {data:ok}=await SB.rpc('email_permitido',{e:email});if(!ok)throw new Error('Este e-mail ainda não foi liberado pelo Prof. Jazz.');
      const {data,error}=await SB.auth.signUp({email,password});
      if(error){if(/registered|exists/i.test(error.message))throw new Error('Esse e-mail já tem senha. Clique em “Já tenho senha — entrar”.');throw error;}
      if(!data.session){const r=await SB.auth.signInWithPassword({email,password});if(r.error)throw r.error;}
    }else{const {error}=await SB.auth.signInWithPassword({email,password});
      if(error){if(/invalid/i.test(error.message))throw new Error('E-mail ou senha incorretos. É a mesma senha do Banco de Questões.');throw error;}}
    gm('');await entrar();
  }catch(e){gm(e.message||'Não foi possível entrar.');}finally{$('gBtn').disabled=false;}};
async function entrar(){const {data:{session}}=await SB.auth.getSession();if(!session){$('gate').hidden=false;return;}
  EMAIL=(session.user.email||'').toLowerCase();IS_ADMIN=EMAIL===ADMIN;
  const {data:ok}=await SB.rpc('is_assessoria');
  $('gate').hidden=true;
  if(!ok){$('app').innerHTML=`<div class="aviso"><h2>Área exclusiva da Assessoria PREPARA UFU</h2><p>Aqui os alunos da Assessoria preenchem o perfil de estudos e recebem um pré-cronograma personalizado, montado a partir da rotina, das dificuldades e do curso de cada um, e ajustado nos encontros com o Prof. Jazz.</p><p>O seu acesso hoje é ao Banco de Questões. Quer fazer parte da Assessoria? Fale com o Prof. Jazz. Se você já é aluno da Assessoria e está vendo esta mensagem, avise o Prof. Jazz para liberar o seu e-mail.</p><a href="../bancodequestoes/">Ir para o Banco de Questões</a></div>`;return;}
  $('tabForm').hidden=false;$('tabResp').hidden=!IS_ADMIN;$('tabGeral').hidden=!IS_ADMIN;
  ALVO=EMAIL;$('tabForm').onclick=telaForm;$('tabResp').onclick=telaResp;$('tabGeral').onclick=telaGeral;$('tabCrono').onclick=telaCrono;$('tabFaq').onclick=telaFaq;$('tabFaq').hidden=false;
  $('tabExemplo').hidden=!IS_ADMIN;$('tabExemplo').onclick=()=>modoExemplo(true);$('exSair').onclick=()=>modoExemplo(false);
  if(!IS_ADMIN){const {data:ex}=await SB.from('checkup').select('email').eq('email',EMAIL).maybeSingle();$('tabCrono').hidden=!ex;}
  if(IS_ADMIN){$('tabForm').textContent='Ver formulário';telaGeral();}else telaForm();}
$('sair').onclick=async()=>{await SB.auth.signOut();location.reload();};
entrar();
</script>
</body>
</html>
